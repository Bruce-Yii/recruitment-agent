                <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${rc.length?rc.map(x=>`${x.name}（${x.stage}）`).join(' · '):'持续监听投递渠道中'}</div>
              </div>
              <span class="cr-status iris num">${rc.length} 人在途</span>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="doc-block">
        <div class="sec-meta">需业务方协助卡点</div>
        <div class="risk-note">
          ${overdueNames.length?`• 初筛超时待拍板：${overdueNames.join('、')}<br>`:''}
          ${nudgePending?`• ${nudgeItem.roleLabel}${nudgeItem.overdueLabel}（${nudgeItem.interviewer}未提交）<br>`:''}
          ${candidates.filter(c=>c.stage==='三面终审').map(c=>`• ${c.name}已进入三面终审，建议本周内完成终审拍板或专项加面`).join('<br>')}
        </div>
      </div>`;

    $('back-from-rep').onclick=()=>{space='inbox';render();};
    $('copy-weekly-rep').onclick=()=>{
      navigator.clipboard?.writeText(reportPlain).catch(()=>{});
      showToast('已复制本周招聘进展汇报，可直接粘贴至飞书群');
    };
  }

  $('role-view-sel')?.addEventListener('change',async e=>{
    roleView=e.target.value;
    await safeSubmit('set_actor',{roleView});
    render();
  });
  if(isOffline){
    const ob=document.createElement('div');
    ob.className='offline-bar';
    ob.innerHTML='<span>当前网络已断开 · 面试速记与对话草稿已实时暂存本地，恢复网络后可安全继续</span>';
    inner.prepend(ob);
  }
  if(asyncTask){
    const bar=document.createElement('div');
    bar.className='async-bar'+(asyncTask.status==='done'?' done':'');
    bar.innerHTML=asyncTask.status==='running'
      ?`<span class="thinking-row"><i class="thinking-dot"></i><span>后台异步解析中：正在解析「${asyncTask.fileName}」并对齐岗位标准（你可继续浏览当前页面）…</span></span>`
      :`<span>✓ 后台解析完成：<b>${asyncTask.name}</b> 已入库（4/4 标准命中）</span><div style="display:flex;gap:10px"><button class="text-link" id="async-open-c" style="color:var(--green);font-weight:600">查看档案</button><button class="text-link" id="async-dismiss">关闭</button></div>`;
    inner.prepend(bar);
    $('async-open-c')?.addEventListener('click',()=>{const cid=asyncTask.candId;asyncTask=null;openCandidate(cid);});
    $('async-dismiss')?.addEventListener('click',()=>{asyncTask=null;renderCanvas();});
  }
}

// Universal Centered Confirmation Modal
function openModal(s){modalState=s;modalEdit=false;renderModal();}
function closeModal(){modalState=null;modalEdit=false;$('modal-bg').classList.remove('open');$('modal-bg').innerHTML='';}
function renderModal(){
  const bg=$('modal-bg');
  if(!modalState){bg.classList.remove('open');bg.innerHTML='';return;}
  const m=modalState;
  let title='',body='',editHTML='',extraHTML='',okText='确认',canEdit=false,showOk=true;

  if(m.type==='shortcuts'){
    title='键盘快捷键';showOk=false;
    body='\\  收起或展开最左侧 56px 图标栏\n[  收起或展开 Agent 对话栏\n⌘K  展开并聚焦对话输入框\nE / X  初筛画布：通过 / 不通过\nJ / K  切换考核维度并联动原文高亮\nN / P  切换下一位 / 上一位候选人\nEsc  关闭任意确认弹窗';
  }else if(m.type==='reschedule'){
    const c=getCand(m.candId);
    const slots=uiOptions.rescheduleSlots||[];
    m.slot=m.slot||slots[0]||'';
    const newOwner=m.newOwner||'张工 · 资深后端架构师';
    title=`面试改期与更换面试官 · ${c.name}`;
    body=`原排期：李工 · 今日 15:00\n新排期：${newOwner} · ${m.slot}\n\n确认后将同步更新飞书日历邀约、通知候选人改期，并重新绑定飞书妙记录音归属（防止面评挂错人）。`;
    extraHTML=`<div><div style="font-size:11.5px;color:var(--muted);margin-bottom:7px">切换新面试官空闲时段</div><div class="slot-grid">${slots.map(s=>`<button class="slot-pill ${m.slot===s?'active':''}" data-slot="${s}">${s}</button>`).join('')}</div></div>`;
    okText='确认改期并换人';
  }else if(m.type==='import_resume'){
    const demoPdf=uiOptions.defaultDemoPdf;
    const demoShort=demoPdf.split('_')[0]+'.pdf';
    title='导入简历 PDF 并自动解析对齐';
    body=`你可以直接选择本地 PDF/Word 简历，或一键模拟拖入一份真实候选人简历（${demoPdf}），体验 Agent 3 秒解析建档与标准对齐。`;
    extraHTML=`<div style="display:flex;gap:10px"><button class="btn" id="pick-local-file" style="flex:1">选择本地文件…</button><button class="btn dark" id="sim-drop-pdf" style="flex:1">模拟拖入「${demoShort}」</button></div>`;
    showOk=false;
  }else if(m.type==='thankyou'){
    const c=getCand(m.candId);
    title=`发送礼貌婉拒邮件 · ${c.name}`;
    body=`主题：感谢您应聘「${getRole(c.roleId).name}」\n\n您好 ${c.name}，感谢您参与我们的招聘流程。经综合评估，目前阶段暂未能与该岗位完全匹配，您的资料已保留在人才库中，未来有更契合的机会我们会第一时间联系您。`;
    okText='确认发送';
  }else if(m.type==='nudge'){
    title=`发送飞书催办提醒 · ${nudgeItem.interviewer}`;
    body=nudgeItem.draftText;
    okText='发送提醒';
  }else if(m.type==='offer'){
    canEdit=true;
    const c=getCand(m.candId),r=getRole(c.roleId);
    const lv=m.level||'P7',sal=m.salary||'45k × 16 薪';
    const hcFull=r.hcFilled>=r.hcTotal;
    title=`向 ${c.name} 发送 Offer 邮件`;
    body=`主题：【录用通知】${r.name}（${c.name}）\n\n您好 ${c.name}，很高兴通知您通过全部面试评估，现正式发出录用邀请（${lv} · ${sal}）。请直接回复本邮件确认。\n\n已开启防重发送保护。`;
    if(hcFull)extraHTML=`<div class="risk-note" style="border-left-color:var(--red);color:var(--red)">HC 满额提醒：当前「${r.name}」名额已满（${r.hcFilled}/${r.hcTotal} HC），发出前请确认已获批增补 HC。</div>`;
    editHTML=`<div class="m-edit-grid"><label class="m-field"><span>职级</span><input id="ef-lv" value="${lv}"></label><label class="m-field"><span>薪资方案</span><input id="ef-sal" value="${sal}"></label></div>`;
    okText='确认发送';
  }else if(m.type==='transfer'){
    canEdit=true;
    const c=getCand(m.candId),others=roles.filter(x=>x.id!==c.roleId);
    const t=roles.find(x=>x.id===m.targetId)||others[0]||roles[0];m.targetId=t.id;
    title=`跨岗调剂：${c.name} → ${t.name}`;
    body='原岗位档案完整保留，历史初筛与面评记录无损继承给新岗位面试官。';
    editHTML=`<label class="m-field"><span>目标岗位</span><select id="ef-role">${others.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.name}</option>`).join('')}</select></label>`;
    okText='确认调剂';
  }else if(m.type==='add_round'){
    canEdit=true;
    const c=getCand(m.candId);
    const lbl=m.label||'加面 · 架构交叉核实',foc=m.focus||'核实多 Agent 并发状态回滚深度';
    const slots=uiOptions.addRoundSlots||[];
    m.slot=m.slot||slots[0]||'';
    title=`为 ${c.name} 发起专项加面`;
    body=`轮次：${lbl}\n重点：${foc}\n选定时段：${m.slot}（飞书日历自动发送邀约）`;
    extraHTML=`<div><div style="font-size:11.5px;color:var(--muted);margin-bottom:7px">飞书日历已匹配候选人与面试官空闲交集（点击切换）</div><div class="slot-grid">${slots.map(s=>`<button class="slot-pill ${m.slot===s?'active':''}" data-slot="${s}">${s}</button>`).join('')}</div></div>`;
    editHTML=`<div class="m-edit-grid"><label class="m-field"><span>轮次</span><input id="ef-rl" value="${lbl}"></label><label class="m-field"><span>重点</span><input id="ef-rf" value="${foc}"></label></div>`;
    okText='锁定时间并发起加面';
  }else if(m.type==='compound'){
    const c=getCand(m.candId);
    const slots=uiOptions.compoundSlots||[];
    m.slot=m.slot||slots[0]||'';
    title=`合并确认 · 为 ${c.name} 执行 3 项联动操作`;
    body='Agent 已将你的复合指令拆解为以下 3 步，核对无误点一次即可全部完成：';
    extraHTML=`<div>
      <div class="step-row"><span class="num" style="color:var(--iris);font-weight:600">01</span><span><b>推进阶段</b>：初筛评估 → 一面安排</span></div>
      <div class="step-row"><span class="num" style="color:var(--iris);font-weight:600">02</span><span><b>置顶加急约束</b>：${m.pinText}（同步提醒一面官）</span></div>
      <div class="step-row"><span class="num" style="color:var(--iris);font-weight:600">03</span><span><b>发送飞书日程邀约</b>：${m.slot}</span></div>
    </div>
    <div><div style="font-size:11.5px;color:var(--muted);margin-bottom:7px">切换空闲时段交集</div><div class="slot-grid">${slots.map(s=>`<button class="slot-pill ${m.slot===s?'active':''}" data-slot="${s}">${s}</button>`).join('')}</div></div>`;
    okText='一键确认全部 3 项';
  }else if(m.type==='skip'){
    const c=getCand(m.candId);
    title=`跳轮直通终审：${c.name}`;
    body=m.reason?`已记录你的确认原话：\n“${m.reason}”\n\n中间常规轮次将标记为已豁免。`:'跳轮属于例外流转，请补充一句话确认原因：';
    if(!m.reason)extraHTML=`<label class="m-field"><input id="ef-skip" placeholder="例如：大厂多 Agent 核心负责人背景扎实，直接进入终审"></label>`;
    okText='确认直通终审';
  }else if(m.type==='reject'||m.type==='batch_reject'){
    const isB=m.type==='batch_reject';
    const names=isB?m.ids.map(id=>getCand(id)?.name).join('、'):getCand(m.candId)?.name;
    const rs=uiOptions.rejectReasons||[];
    title=isB?`批量关闭 ${m.ids.length} 位申请`:`关闭 ${names} 的申请`;
    body='关闭后不再触发后续排期提醒，5 秒内可随时撤销。';
    extraHTML=`<div class="m-reasons">${rs.map(r=>`<button class="m-reason ${m.reason===r?'active':''}" data-mr="${r}">${r}</button>`).join('')}</div>`;
    okText='确认关闭';
  }else if(m.type==='scorecard'){
    const c=getCand(m.candId);
    title=`提交结构化面评 · ${c.name}`;
    body=`综合结论：4.5 分 · 推荐推进\n\n${m.summary}`;
    okText='确认提交';
  }else if(m.type==='new_job'){
    title='新建招聘岗位';
    body='确认后自动锁定默认考核标准 V1 并启动简历监听。';
    extraHTML=`<div class="m-edit-grid"><label class="m-field"><span>岗位名称</span><input id="ef-jn" value="${m.name||''}" placeholder="例如：前端架构师"></label><label class="m-field"><span>HC 数量</span><input id="ef-jh" type="number" min="1" value="${m.hc||1}"></label></div>`;
    okText='确认创建';
  }

  bg.innerHTML=`<div class="modal">
    <div class="m-top">
      <div style="font-size:17px;font-weight:650">${title}</div>
      ${canEdit?`<button class="text-link" id="m-ed">${modalEdit?'完成':'微调'}</button>`:''}
    </div>
    <div class="m-preview">${body}</div>
    ${extraHTML}
    ${modalEdit?editHTML:''}
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn" id="m-c">${showOk?'取消':'知道了'}</button>
      ${showOk?`<button class="btn dark" id="m-ok">${okText}</button>`:''}
    </div>
  </div>`;
  bg.classList.add('open');
  bg.onclick=e=>{if(e.target===bg)closeModal();};
  $('m-c').onclick=closeModal;
  bg.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{m.reason=b.dataset.mr;renderModal();});
  bg.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{m.slot=b.dataset.slot;renderModal();});
  $('pick-local-file')?.addEventListener('click',()=>$('resume-file-input').click());
  $('sim-drop-pdf')?.addEventListener('click',()=>{closeModal();ingestDemoResume(uiOptions.defaultDemoPdf);});

  $('m-ed')?.addEventListener('click',()=>{
    if(modalEdit){
      if(m.type==='offer'){m.level=$('ef-lv')?.value||m.level;m.salary=$('ef-sal')?.value||m.salary;}
      if(m.type==='transfer'){m.targetId=$('ef-role')?.value||m.targetId;}
      if(m.type==='add_round'){m.label=$('ef-rl')?.value||m.label;m.focus=$('ef-rf')?.value||m.focus;}
    }
    modalEdit=!modalEdit;renderModal();
  });
  $('m-ok')?.addEventListener('click',async()=>{
    const okBtn=$('m-ok');
    if(okBtn.disabled)return;
    okBtn.disabled=true;okBtn.style.opacity='.65';
    const resetBtn=()=>{okBtn.disabled=false;okBtn.style.opacity='1';};

    if(m.type==='skip'){
      const reason=($('ef-skip')?.value||m.reason||'').trim();
      if(!reason){resetBtn();showToast('请先填写一句话跳轮原因');$('ef-skip')?.focus();return;}
      snap();
      const res=await safeSubmit('skip',{candId:m.candId,reason});
      if(!res){resetBtn();return;}
      const c=getCand(m.candId);
      if(res.candidate)syncCandidateFromApi(res.candidate);
      else if(c){c.stage='三面终审';c.hours=0;c.rounds.push({t:'三面终审（跳轮）',s:'待拍板',d:`确认原话：${reason}`});c.timeline.unshift({t:nowHM(),d:`人工原话跳轮直通终审（${reason}）`});}
      messages.push({role:'ai',text:`已记录原话，${c.name} 直通三面终审。`,tag:'跳轮直通终审'});
    }else if(m.type==='reschedule'){
      const c=getCand(m.candId);
      const newOwner=m.newOwner||'张工';
      snap();
      const res=await safeSubmit('reschedule',{candId:m.candId,newOwner,slot:m.slot});
      if(!res){resetBtn();return;}
      if(res.connectorDown==='cal'){
        pendingRetry={connId:'cal',run:async()=>{
          const r2=await safeSubmit('reschedule',{candId:m.candId,newOwner,slot:m.slot,forceReconnect:true});
          if(r2&&r2.candidate)syncCandidateFromApi(r2.candidate);
          messages.push({role:'ai',text:`飞书日历已恢复，已安全完成 ${c.name} 改期与更换面试官。`,tag:'重试成功'});
        }};
        messages.push({role:'ai',text:`为 ${c.name} 改期失败：飞书日历连接已断开，未发出重复日程邀约。`,retryId:'cal_'+c.id});
        closeModal();render();showToast('改期失败：飞书日历未连接，可在对话栏一键重试');return;
      }
      if(res.candidate)syncCandidateFromApi(res.candidate);
      openCandidate(c.id);
      messages.push({role:'ai',text:`已将 ${c.name} 的二面面试官更换为 ${newOwner}，改期至 ${m.slot}，并重新绑定了飞书妙记归属。`,tag:'已改期换人'});
    }else if(m.type==='thankyou'){
      snap();
      const res=await safeSubmit('thankyou',{candId:m.candId});
      if(!res){resetBtn();return;}
      const c=getCand(m.candId);
      if(res.candidate)syncCandidateFromApi(res.candidate);
      messages.push({role:'ai',text:`已向 ${c.name} 发送礼貌婉拒邮件。`,tag:'邮件已发送'});
    }else if(m.type==='nudge'){
      snap();
      const res=await safeSubmit('nudge',{interviewer:nudgeItem.interviewer});
      if(!res){resetBtn();return;}
      nudgePending=false;
      if(res.autoDone)autoDone=res.autoDone;
      messages.push({role:'ai',text:`已向${nudgeItem.interviewer}发出飞书提醒。`,tag:'飞书提醒已发'});
    }else if(m.type==='offer'){
      const c=getCand(m.candId);
      snap();
      const res=await safeSubmit('offer',{candId:m.candId,level:m.level,salary:m.salary});
      if(!res){resetBtn();return;}
      if(res.duplicate){showToast('防重保护：该候选人已发送过 Offer');closeModal();return;}
      if(res.connectorDown==='mail'){
        pendingRetry={connId:'mail',run:async()=>{
          const r2=await safeSubmit('offer',{candId:m.candId,level:m.level,salary:m.salary,forceReconnect:true});
          if(r2&&r2.candidate)syncCandidateFromApi(r2.candidate);
          messages.push({role:'ai',text:`企业邮箱已恢复，已安全向 ${c.name} 发出正式 Offer 邮件。`,tag:'重试发送成功'});
        }};
        messages.push({role:'ai',text:`向 ${c.name} 发送 Offer 失败：企业邮箱当前处于断开状态，未发出重复邮件。`,retryId:'offer_'+c.id});
        closeModal();render();showToast('发送失败：企业邮箱未连接，可在对话栏一键安全重试');return;
      }
      if(res.candidate)syncCandidateFromApi(res.candidate);
      else{c.offerStatus='SENT';c.stage='Offer 待确认';c.timeline.unshift({t:nowHM(),d:'已发送正式 Offer 邮件，等待确认'});}
      messages.push({role:'ai',text:`已向 ${c.name} 发出正式 Offer 邮件，正在追踪签收回执。`,tag:'Offer 已发'});
    }else if(m.type==='transfer'){
      snap();
      const targetId=$('ef-role')?.value||m.targetId;
      const res=await safeSubmit('transfer',{candId:m.candId,targetId});
      if(!res){resetBtn();return;}
      const c=getCand(m.candId),t=getRole(targetId);
      if(res.clonedCandidate){syncCandidateFromApi(res.clonedCandidate);openCandidate(res.clonedCandidate.id);}
      messages.push({role:'ai',text:`已将 ${c.name} 调剂至「${t.name}」，原记录完整保留。`,tag:`已调剂至 ${t.name}`});
    }else if(m.type==='compound'){
      snap();
      const res=await safeSubmit('compound',{candId:m.candId,pinText:m.pinText,slot:m.slot});
      if(!res){resetBtn();return;}
      const c=getCand(m.candId);
      if(res.candidate)syncCandidateFromApi(res.candidate);
      openCandidate(c.id);
      messages.push({role:'ai',text:`已一次性完成 ${c.name} 的 3 项联动操作：推进至一面、置顶加急约束，并发出 ${m.slot} 的飞书日程邀约。`,tag:'3 项联动已完成'});
    }else if(m.type==='add_round'){
      const c=getCand(m.candId);
      const label=$('ef-rl')?.value||m.label||'加面 · 交叉核实';
      const focus=$('ef-rf')?.value||m.focus||'核实并发状态回滚深度';
      snap();
      const res=await safeSubmit('add_round',{candId:m.candId,label,focus,slot:m.slot});
      if(!res){resetBtn();return;}
      if(res.connectorDown==='cal'){
        pendingRetry={connId:'cal',run:async()=>{
          const r2=await safeSubmit('add_round',{candId:m.candId,label,focus,slot:m.slot,forceReconnect:true});
          if(r2&&r2.candidate)syncCandidateFromApi(r2.candidate);
          messages.push({role:'ai',text:`飞书日历已恢复，已为 ${c.name} 锁定「${m.slot}」专项加面。`,tag:'重试成功'});
        }};
        messages.push({role:'ai',text:`为 ${c.name} 发起加面失败：飞书日历连接已断开。`,retryId:'cal_add_'+c.id});
        closeModal();render();showToast('发起加面失败：飞书日历未连接，可在对话栏一键重试');return;
      }
      if(res.candidate)syncCandidateFromApi(res.candidate);
      messages.push({role:'ai',text:`已为 ${c.name} 锁定「${m.slot}」专项加面并同步飞书日历。`,tag:'已发起加面'});
    }else if(m.type==='reject'){
      snap();
      const res=await safeSubmit('reject',{candId:m.candId,reason:m.reason});
      if(!res){resetBtn();return;}
      const c=getCand(m.candId);
      if(res.candidate)syncCandidateFromApi(res.candidate);
      else if(c){c.stage='已结束';c.timeline.unshift({t:nowHM(),d:`关闭申请（原因：${m.reason}）`});}
      if(autoAdvance)advanceNextIfEnabled(c);
      else activeCandId=null;
      messages.push({role:'ai',text:`已关闭 ${c.name} 的申请（${m.reason}）。`,tag:'申请已关闭'});
    }else if(m.type==='batch_reject'){
      snap();
      const res=await safeSubmit('batch_reject',{ids:m.ids,reason:m.reason});
      if(!res){resetBtn();return;}
      m.ids.forEach(id=>{const c=getCand(id);if(c){c.stage='已结束';c.timeline.unshift({t:nowHM(),d:`批量关闭申请（${m.reason}）`});}});selectedIds.clear();
      messages.push({role:'ai',text:`已批量关闭 ${m.ids.length} 位候选人申请。如需发礼貌婉拒邮件，直接告诉我即可。`,tag:`批量关闭 ${m.ids.length} 人`});
    }else if(m.type==='scorecard'){
      snap();
      const res=await safeSubmit('scorecard',{candId:m.candId,summary:m.summary});
      if(!res){resetBtn();return;}
      const c=getCand(m.candId);
      if(res.candidate)syncCandidateFromApi(res.candidate);
      else if(c){c.rounds.push({t:'本轮面评',s:'4.5 分 · 推荐',d:m.summary});c.stage='三面终审';c.timeline.unshift({t:nowHM(),d:'面试官提交结构化面评（4.5 分 · 推荐）'});}
      messages.push({role:'ai',text:`已提交 ${c.name} 的结构化面评并同步至终审。`,tag:'面评已提交'});
    }else if(m.type==='new_job'){
      snap();
      const nm=($('ef-jn')?.value||m.name||'前端架构师').trim();
      const hc=Math.max(1,Number($('ef-jh')?.value||m.hc||1));
      const res=await safeSubmit('new_job',{name:nm,hc});
      if(!res){resetBtn();return;}
      if(res.role){syncRoleFromApi(res.role);space='jobs';activeJobId=res.role.id;activeCandId=null;jobTab='pipeline';}
      messages.push({role:'ai',text:`已创建「${nm}」（${hc} HC）并启动简历监听。`,tag:`新建岗位 · ${nm}`});
    }
    closeModal();render();showToast('操作已完成',true);
  });
}

function handleCommand(raw){
  const t=raw.trim();if(!t)return;
  messages.push({role:'user',text:t});
  const isSlow=t.includes('约')||t.includes('改期')||t.includes('周报')||t.toLowerCase().includes('offer');
  const thinkingMsg={role:'ai',thinking:true,text:isSlow?'正在读取岗位上下文与外部连接状态…':'正在理解意图…'};
  messages.push(thinkingMsg);
  renderChat();
  if(isSlow){
    setTimeout(()=>{thinkingMsg.text=t.includes('周报')?'正在汇总各岗位 HC 与超时卡点…':'正在查询飞书日历空闲时段与防重校验…';renderChat();},220);
  }
  setTimeout(async()=>{
    const ti=messages.indexOf(thinkingMsg);
    if(ti>=0)messages.splice(ti,1);
    await executeParsedCommand(t);
  },isSlow?480:220);
}

async function executeParsedCommand(t){
  let parsed;
  try{
    parsed=await api.sendCommand(t,{candidates,roles,activeCandId});
  }catch(err){
    handleApiError(err);
    renderChat();
    return;
  }
  if(!parsed||parsed.kind==='noop')return;
  if(parsed.kind==='disambig'){
    messages.push(parsed.message);
    renderChat();
    return;
  }
  if(parsed.kind==='action'){
    snap();
    const res=await safeSubmit(parsed.actionName,parsed.payload);
    if(!res){renderChat();return;}
    if(res.candidate)syncCandidateFromApi(res.candidate);
    if(parsed.openCandId)openCandidate(parsed.openCandId);
    if(parsed.message)messages.push(parsed.message);
    render();
    return;
  }
  if(parsed.openCandId)openCandidate(parsed.openCandId);
  if(parsed.kind==='open_modal'&&parsed.modal)openModal(parsed.modal);
  if(parsed.kind==='navigate'&&parsed.nav){
    const n=parsed.nav;
    if(n.space!==undefined)space=n.space;
    if(n.activeJobId!==undefined)activeJobId=n.activeJobId;
    if(n.activeCandId!==undefined)activeCandId=n.activeCandId;
    if(n.jobTab!==undefined)jobTab=n.jobTab;
    if(n.inboxTab!==undefined)inboxTab=n.inboxTab;
  }
  if(parsed.kind==='set_role_view'){
    roleView=parsed.roleView;
    await safeSubmit('set_actor',{roleView});
  }
  if(parsed.kind==='open_doc_tab')docTab=parsed.docTab;
  if(parsed.kind==='set_theme')document.documentElement.dataset.theme=parsed.theme;
  if(parsed.kind==='set_rail')setRailCollapsed(parsed.collapsed);
  if(parsed.kind==='set_chat')setChatCollapsed(parsed.collapsed);
  if(parsed.message)messages.push(parsed.message);
  render();
}

function render(){renderRail();renderChat();renderCanvas();}

// Global Nav & Controls
document.querySelectorAll('.rail-btn[data-space]').forEach(b=>b.onclick=()=>{
  space=b.dataset.space;
  if(space==='jobs'){activeJobId=null;activeCandId=null;}
  else{activeCandId=null;}
  selectedIds.clear();
  render();
});
$('collapse-chat-btn').onclick=()=>setChatCollapsed(true);
$('collapse-rail-btn').onclick=()=>setRailCollapsed(document.documentElement.dataset.rail!=='collapsed');

$('toggle-chat-rail').onclick=()=>setChatCollapsed(document.documentElement.dataset.chat!=='collapsed');
$('theme-btn').onclick=()=>{
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem('ros-v4-theme',next);}catch(e){}
};
$('shortcuts-btn').onclick=()=>openModal({type:'shortcuts'});
$('settings-btn').onclick=()=>{space='settings';activeCandId=null;render();};
$('attach-resume-btn').onclick=()=>openModal({type:'import_resume'});
$('resume-file-input').onchange=e=>{const f=e.target.files?.[0];if(f){closeModal();ingestDemoResume(f);e.target.value='';}};

const send=()=>{const v=$('chat-input').value.trim();if(!v)return;$('chat-input').value='';try{localStorage.removeItem('ros-v4-chat-draft');}catch(e){}handleCommand(v);};
$('chat-send').onclick=send;
$('chat-input').oninput=e=>{try{localStorage.setItem('ros-v4-chat-draft',e.target.value);}catch(err){}};
$('chat-input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send();}};

document.addEventListener('keydown',e=>{
  const inInput=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName||'');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setChatCollapsed(false);$('chat-input').focus();return;}
  if(e.key==='Escape'){closeModal();return;}
  if(inInput)return;
  if(e.key==='['){e.preventDefault();setChatCollapsed(document.documentElement.dataset.chat!=='collapsed');return;}
  if(e.key==='\\'){e.preventDefault();setRailCollapsed(document.documentElement.dataset.rail!=='collapsed');return;}
  if(e.key==='?'){e.preventDefault();openModal({type:'shortcuts'});return;}
  if(space==='jobs'&&activeJobId&&activeCandId){
    const c=getCand(activeCandId);
    const k=e.key.toLowerCase();
    if(k==='e'&&c?.stage==='初筛评估'){$('doc-pass')?.click();}
    else if(k==='x'&&c?.stage==='初筛评估'){$('doc-reject')?.click();}
    else if(k==='n'){$('next-c')?.click();}
    else if(k==='p'){$('prev-c')?.click();}
    else if((k==='j'||k==='k')&&c){
      const ks=c.criteria.map(x=>x.k);
      activeCrit=ks[(ks.indexOf(activeCrit)+(k==='j'?1:-1)+ks.length)%ks.length];
      renderCanvas();
    }
  }
});

window.addEventListener('offline',()=>{isOffline=true;renderCanvas();});
window.addEventListener('online',()=>{isOffline=false;renderCanvas();showToast('网络已恢复连接');});

// Resizable Chat Column (double-click resets to 324px)
const resizer=$('chat-resizer'),shellEl=document.querySelector('.shell');
resizer.ondblclick=()=>{shellEl.style.setProperty('--chat-w','324px');};
resizer.onmousedown=e=>{
  e.preventDefault();
  resizer.classList.add('dragging');shellEl.classList.add('resizing');
  document.body.style.userSelect='none';
  const railW=document.documentElement.dataset.rail==='collapsed'?56:204;
  const onMove=ev=>{
    const w=Math.max(260,Math.min(480,ev.clientX-railW));
    shellEl.style.setProperty('--chat-w',w+'px');
  };
  const onUp=()=>{
    resizer.classList.remove('dragging');shellEl.classList.remove('resizing');
    document.body.style.userSelect='';
    window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);
  };
  window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
};

// True HTML5 Drag-and-Drop PDF Resume into Chat Column
const chatCol=$('chat-col');
chatCol.addEventListener('dragover',e=>{e.preventDefault();chatCol.classList.add('drag-over');});
chatCol.addEventListener('dragleave',e=>{if(!chatCol.contains(e.relatedTarget))chatCol.classList.remove('drag-over');});
chatCol.addEventListener('drop',e=>{
  e.preventDefault();chatCol.classList.remove('drag-over');
  const file=e.dataTransfer?.files?.[0];
  ingestDemoResume(file||uiOptions.defaultDemoPdf);
});

async function bootstrap(){
  try{
    if(localStorage.getItem('ros-v4-theme')==='dark')document.documentElement.dataset.theme='dark';
    if(localStorage.getItem('ros-v4-chat')==='collapsed')setChatCollapsed(true);
    if(localStorage.getItem('ros-v4-rail')==='collapsed')setRailCollapsed(true);
    const savedDraft=localStorage.getItem('ros-v4-chat-draft');
    if(savedDraft)$('chat-input').value=savedDraft;
  }catch(e){}

  try{
    const data=await api.getBootstrap();
    roles=data.roles||[];
    candidates=data.candidates||[];
    autoDone=data.autoDone||[];
    nudgePending=Boolean(data.nudgePending);
    if(data.nudgeItem)nudgeItem=data.nudgeItem;
    messages=data.messages||[];
    connectors=data.connectors||[];
    autoRules=data.autoRules||[];
    if(data.slaConfig)slaConfig=data.slaConfig;
    if(data.options)uiOptions=data.options;
    if(data.actor&&data.actor.roleView)roleView=data.actor.roleView;
    try{
      candidates.forEach(c=>{const n=localStorage.getItem('ros-v4-notes-'+c.id);if(n)c.notes=n;});
    }catch(e){}
  }catch(err){
    handleApiError(err);
  }
  render();
}

bootstrap();
})();
</script>
