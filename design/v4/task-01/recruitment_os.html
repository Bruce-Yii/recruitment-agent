<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruitment OS · 层层递进架构版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#F3F2EE;
  --paper:#F9F8F5;
  --surface:#FFFFFF;
  --subtle:#F3F2EE;
  --hover:#EAE8E2;
  --ink:#191918;
  --text:#42423F;
  --muted:#787772;
  --soft:#A6A59E;
  --line:rgba(25,25,24,.08);
  --line-soft:rgba(25,25,24,.05);
  --iris:#5B5BD6;
  --iris-soft:rgba(91,91,214,.09);
  --green:#18794E;
  --green-soft:rgba(24,121,78,.09);
  --amber:#AD5700;
  --amber-soft:rgba(173,87,0,.09);
  --red:#CD2B31;
  --red-soft:rgba(205,43,49,.08);
  --shadow-card:0 1px 2px rgba(25,25,24,.03),0 10px 30px -14px rgba(25,25,24,.07);
  --shadow-modal:0 28px 72px -18px rgba(25,25,24,.24);
}
[data-theme="dark"]{
  --rail:#10100F;
  --paper:#141413;
  --surface:#1A1A19;
  --subtle:#232321;
  --hover:#2B2B28;
  --ink:#F3F2EE;
  --text:#D5D4CE;
  --muted:#9A9992;
  --soft:#6F6E68;
  --line:rgba(243,242,238,.09);
  --line-soft:rgba(243,242,238,.055);
  --iris:#8484F5;
  --iris-soft:rgba(132,132,245,.15);
  --green:#3DD68C;
  --green-soft:rgba(61,214,140,.13);
  --amber:#F5A524;
  --amber-soft:rgba(245,165,36,.14);
  --red:#F87171;
  --red-soft:rgba(248,113,113,.14);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-modal:0 28px 72px -18px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--rail);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(128,128,120,.2);border-radius:99px}

/* 3-Layer Progressive Shell: Resizable Chat + 56px Gemini-style Icon Rail */
.shell{--chat-w:324px;display:grid;grid-template-columns:204px var(--chat-w) 1fr;height:100vh;width:100%;overflow:hidden;transition:grid-template-columns .22s cubic-bezier(.2,.8,.2,1)}
.shell.resizing{transition:none}
[data-chat="collapsed"] .shell{grid-template-columns:204px 0px 1fr}
[data-rail="collapsed"] .shell{grid-template-columns:56px var(--chat-w) 1fr}
[data-rail="collapsed"][data-chat="collapsed"] .shell{grid-template-columns:56px 0px 1fr}
.chat-resizer{position:absolute;top:0;right:-3px;bottom:0;width:6px;cursor:col-resize;z-index:15}
.chat-resizer:after{content:'';position:absolute;top:0;bottom:0;left:2px;width:2px;background:transparent;transition:background .15s}
.chat-resizer:hover:after,.chat-resizer.dragging:after{background:var(--iris)}
.drop-overlay{position:absolute;inset:10px;border-radius:14px;border:1.5px dashed var(--iris);background:rgba(249,248,245,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:25;pointer-events:none;color:var(--iris);font-size:13px;font-weight:500}
[data-theme="dark"] .drop-overlay{background:rgba(20,20,19,.92)}
.chat-col.drag-over .drop-overlay{display:flex}
@keyframes pulseDot{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
.thinking-row{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.thinking-dot{width:6px;height:6px;border-radius:99px;background:var(--iris);animation:pulseDot .9s ease-in-out infinite}

/* 1. Left Slim Space Rail (Collapses gracefully to 56px clickable Icon Rail) */
.space-rail{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;background:var(--rail);border-right:1px solid var(--line);padding:0 10px;transition:padding .2s ease}
[data-rail="collapsed"] .space-rail{padding:0 8px;align-items:center}
.rail-brand{height:56px;padding:0 4px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:650;letter-spacing:-.02em;flex:none;width:100%}
.brand-identity{display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden}
[data-rail="collapsed"] .rail-brand{padding:0;justify-content:center}
[data-rail="collapsed"] .brand-identity,[data-rail="collapsed"] .rail-lbl,[data-rail="collapsed"] .rail-cnt,[data-rail="collapsed"] .rail-jobs{display:none}
[data-rail="collapsed"] .rail-nav{width:100%;align-items:center;gap:6px}
[data-rail="collapsed"] .rail-btn{width:38px;height:38px;padding:0;justify-content:center;border-radius:10px}
[data-rail="collapsed"] .rail-btn-l{gap:0;justify-content:center}
[data-rail="collapsed"] .rail-btn-l svg{width:17px;height:17px}
[data-rail="collapsed"] .rail-foot{flex-direction:column;align-items:center;gap:6px;padding:12px 0;width:100%}

.rail-expand-btn,.chat-expand-pill{display:none}
.brand-dot{width:22px;height:22px;border-radius:7px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
.brand-dot svg{width:12px;height:12px;fill:currentColor}
.rail-nav{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.rail-btn{height:33px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:450;color:var(--text);transition:background .12s,color .12s;text-align:left}
.rail-btn:hover{background:var(--hover);color:var(--ink)}
.rail-btn.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(25,25,24,.06)}
.rail-btn-l{display:flex;align-items:center;gap:8px;min-width:0}
.rail-btn-l svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);flex:none}
.rail-btn.active .rail-btn-l svg{color:var(--ink)}
.rail-cnt{font-size:11.5px;color:var(--soft)}

.rail-jobs{display:flex;flex-direction:column;gap:1px;margin:4px 0 8px;padding-left:12px;border-left:1px solid var(--line);margin-left:16px}
.rail-job{height:30px;padding:0 9px;border-radius:7px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted);transition:background .12s,color .12s}
.rail-job:hover{background:var(--hover);color:var(--ink)}
.rail-job.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(25,25,24,.05)}
.rail-job-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-job-hc{font-size:11px;color:var(--soft);flex:none}

.rail-foot{margin-top:auto;padding:12px 4px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:4px}
.icon-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* 2. Collapsible Accompanying Agent Chat Column */
.chat-col{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;background:var(--paper);border-right:1px solid var(--line);position:relative;z-index:2;transition:opacity .18s ease}
[data-chat="collapsed"] .chat-col{opacity:0;border-right-color:transparent;pointer-events:none}
.chat-head{height:56px;padding:0 14px 0 18px;display:flex;align-items:center;justify-content:space-between;flex:none;border-bottom:1px solid var(--line-soft)}
.chat-title{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chat-stream{flex:1;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:94%;font-size:13px;line-height:1.68;animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.ai{align-self:flex-start;color:var(--text)}
.msg.user{align-self:flex-end;background:var(--subtle);color:var(--ink);padding:8px 12px;border-radius:13px 13px 4px 13px;font-weight:450}
.msg-action-tag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:2px 8px;border-radius:99px;background:var(--iris-soft);color:var(--iris);font-size:11px;font-weight:500}

.quick-list{padding:0 18px 10px;display:flex;flex-wrap:wrap;gap:6px;flex:none}
.q-pill{padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--text);transition:all .14s}
.q-pill:hover{border-color:var(--muted);color:var(--ink);transform:translateY(-1px)}

.composer-wrap{padding:0 14px 16px;flex:none}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-card);transition:border-color .16s}
.composer:focus-within{border-color:var(--muted)}
.composer input{flex:1;min-width:0;border:0;background:transparent;font-size:13px;color:var(--ink);outline:none}
.composer input::placeholder{color:var(--soft)}
.send-circle{width:28px;height:28px;border-radius:99px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none;transition:opacity .14s,transform .14s}
.send-circle:hover{opacity:.86}
.send-circle:active{transform:scale(.95)}
.send-circle svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* 3. Main Contextual White Canvas (Top Bar STRICTLY reflects active space!) */
.canvas-col{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;background:var(--surface);min-width:0;position:relative;z-index:2}
.canvas-head{height:56px;padding:0 36px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none}
.canvas-head-left{display:flex;align-items:center;gap:16px;min-width:0}
.canvas-tabs{display:inline-flex;gap:22px}
.c-tab{font-size:13px;font-weight:500;color:var(--muted);padding:17px 0;position:relative;transition:color .14s;white-space:nowrap}
.c-tab:hover{color:var(--ink)}
.c-tab.active{color:var(--ink);font-weight:600}
.c-tab.active:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);border-radius:2px}
.crumb-bar{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-link{color:var(--muted);font-size:13px;transition:color .12s}
.crumb-link:hover{color:var(--ink)}
.crumb-cur{color:var(--ink);font-weight:600}

.canvas-right-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex:none}
.quiet-select{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;outline:none;padding:3px 5px;border-radius:6px}
.quiet-select:hover{background:var(--paper);color:var(--ink)}

.canvas-body{flex:1;overflow-y:auto;padding:34px 48px 72px;position:relative}
.canvas-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:32px;animation:fadeIn .2s ease-out}
[data-chat="collapsed"] .canvas-inner{max-width:920px}

/* Shared Editorial Typography */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-title{font-size:15px;font-weight:650;letter-spacing:-.015em;color:var(--ink)}
.sec-meta{font-size:12px;color:var(--soft)}
.text-link{font-size:12.5px;color:var(--muted);transition:color .12s}
.text-link:hover{color:var(--ink)}
.text-link.active{color:var(--ink);font-weight:600}

/* 6-Stage Horizontal Flow Lines */
@keyframes orbit{to{transform:rotate(360deg)}}
.flow-list{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.flow-row{padding:20px 0;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:14px;cursor:pointer}
.flow-row:hover .flow-job-name{color:var(--iris)}
.flow-top{display:flex;align-items:baseline;justify-content:space-between}
.flow-job-name{font-size:14.5px;font-weight:600;color:var(--ink);transition:color .14s}
.flow-hc{font-size:12px;color:var(--muted)}
.stage-track{display:grid;grid-template-columns:repeat(6,1fr);align-items:center}
.st-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.st-node:not(:last-child):after{content:'';position:absolute;top:9px;left:calc(50% + 10px);right:calc(-50% + 10px);height:1.5px;background:var(--line)}
.st-node.done:not(:last-child):after{background:var(--green)}
.st-dot{position:relative;z-index:1;width:19px;height:19px;border-radius:99px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-size:10px;font-weight:700;color:var(--soft)}
.st-node.done .st-dot{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.st-node.now .st-dot{border-color:var(--iris);background:var(--iris-soft);color:var(--iris)}
.st-node.now .st-dot:after{content:'';position:absolute;inset:-2.5px;border:1.5px solid transparent;border-top-color:var(--iris);border-radius:99px;animation:orbit 1s linear infinite}
.st-node.wait .st-dot{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.st-lbl{font-size:11.5px;color:var(--muted)}
.st-node.now .st-lbl,.st-node.wait .st-lbl{color:var(--ink);font-weight:550}

/* Signature Gliding Hover List (Preserved Verbatim!) */
.clean-list{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.clean-row{padding:13px 4px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;transition:background .12s,padding .12s;border-radius:8px}
.clean-row:hover{background:var(--paper);padding-inline:12px;margin-inline:-8px}
.cr-left{display:flex;align-items:center;gap:12px;min-width:0}
.mono{width:30px;height:30px;border-radius:99px;background:var(--subtle);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.cr-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.cr-role{font-size:12.5px;color:var(--muted);margin-left:8px;font-weight:400}
.cr-status{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.cr-status.red{color:var(--red)}
.cr-status.amber{color:var(--amber)}
.cr-status.iris{color:var(--iris)}
.cr-status.green{color:var(--green)}

/* Candidate Artifact View */
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line-soft)}
.doc-name{font-size:23px;font-weight:700;letter-spacing:-.03em;color:var(--ink);display:flex;align-items:center;gap:10px}
.doc-meta{font-size:13px;color:var(--muted);margin-top:4px}
.pin-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pin-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--red);font-size:11.5px;font-weight:600}
.pin-tag.neutral{background:var(--subtle);color:var(--text);font-weight:500}
.stepper{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.stepper button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.stepper button:hover{background:var(--subtle);color:var(--ink)}

.doc-block{display:flex;flex-direction:column;gap:10px}
.doc-line{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:13.5px;line-height:1.78;color:var(--text);padding:7px 10px;margin:0 -10px;border-radius:8px;cursor:pointer;transition:background .12s}
.doc-line:hover{background:var(--paper)}
.doc-line.active{background:var(--iris-soft)}
.doc-no{color:var(--soft);font-size:12px;padding-top:2px}
.resume-group-title{font-size:11.5px;font-weight:600;color:var(--soft);letter-spacing:.03em;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line-soft)}
.resume-group-title:first-child{margin-top:4px;padding-top:0;border-top:0}
.exp-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.exp-co{font-size:13.5px;font-weight:600;color:var(--ink)}
.exp-time{font-size:12px;color:var(--soft);flex:none}
.jd-box{padding:20px 22px;border-radius:12px;background:var(--paper);display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:1.75;color:var(--text)}
.jd-sec-t{font-size:12px;font-weight:650;color:var(--ink);margin-bottom:4px}
.crit-item{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:8px;cursor:pointer;transition:background .12s}
.crit-item:hover{background:var(--paper)}
.crit-item.active{background:var(--iris-soft)}

/* Sequential Round Rail */
.seq-rail{display:flex;align-items:center;padding:16px 0;border-bottom:1px solid var(--line-soft);overflow-x:auto}
.seq-n{display:flex;align-items:center;gap:8px;flex:none}
.seq-d{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:1.5px solid var(--line);color:var(--soft)}
.seq-d.done{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.seq-d.caution{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.seq-d.now{border-color:var(--iris);background:var(--iris-soft);color:var(--iris)}
.seq-l{flex:1;min-width:20px;height:1.5px;background:var(--line);margin:0 10px}
.seq-l.done{background:var(--green)}
.risk-note{padding:12px 16px;border-radius:10px;background:var(--paper);border-left:3px solid var(--amber);font-size:13px;line-height:1.68;color:var(--text)}

.comp-table{width:100%;border-collapse:collapse}
.comp-table th,.comp-table td{padding:13px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top;font-size:13px}
.comp-table th{font-weight:600;color:var(--ink)}
.clean-search{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;color:var(--ink);width:210px;outline:none}
.clean-search:focus{border-color:var(--muted)}

.iq-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;cursor:pointer}
.iq-row.done{opacity:.5;text-decoration:line-through}
.clean-notes{width:100%;min-height:120px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;line-height:1.7;resize:vertical;outline:none}
.clean-notes:focus{border-color:var(--muted)}
.auto-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);cursor:pointer}
.auto-toggle:hover{color:var(--ink)}

.batch-float{position:sticky;bottom:0;margin-top:8px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12.5px;box-shadow:var(--shadow-modal)}
.batch-float button{color:var(--surface);font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(128,128,128,.24)}
.batch-float button:hover{background:rgba(128,128,128,.38)}

.btn{height:34px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .14s}
.btn:hover{background:var(--subtle)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.dark:hover{opacity:.88}
.doc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;border-top:1px solid var(--line-soft);flex-wrap:wrap}

/* Centered Confirmation Modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(25,25,24,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{display:flex}
.modal{width:100%;max-width:520px;background:var(--surface);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-modal);padding:26px 28px;display:flex;flex-direction:column;gap:18px;animation:fadeIn .16s ease-out}
.m-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.m-preview{padding:16px 18px;border-radius:12px;background:var(--paper);font-size:13px;line-height:1.75;color:var(--text);white-space:pre-line}
.m-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.m-field input,.m-field select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;outline:none}
.m-reasons{display:flex;gap:7px;flex-wrap:wrap}
.m-reason{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--text)}
.m-reason.active{background:var(--red-soft);border-color:rgba(205,43,49,.3);color:var(--red);font-weight:500}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:99px;font-size:12.5px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:all .16s;z-index:120}
.toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.slot-grid{display:flex;gap:8px;flex-wrap:wrap}
.slot-pill{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--text);transition:all .12s}
.slot-pill:hover{border-color:var(--muted)}
.slot-pill.active{background:var(--iris-soft);border-color:var(--iris);color:var(--iris);font-weight:600}
.ts-badge{font-size:11px;font-weight:600;color:var(--iris);background:var(--iris-soft);padding:1px 6px;border-radius:5px;margin-right:8px}
.ts-ctx{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--paper);font-size:12.5px;line-height:1.7;color:var(--muted)}
.switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.sw-track{width:34px;height:19px;border-radius:99px;background:var(--line);transition:background .16s;position:relative}
.sw-track:after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:99px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .16s}
.switch input:checked + .sw-track{background:var(--ink)}
.switch input:checked + .sw-track:after{transform:translateX(15px)}
.step-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.step-row:last-child{border-bottom:0}
.async-bar{margin:0 0 18px;padding:10px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--text);animation:fadeIn .18s ease-out}
.async-bar.done{background:var(--green-soft);border-color:rgba(24,121,78,.2);color:var(--green)}
.disambig-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.disambig-btn{padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink);transition:all .14s}
.disambig-btn:hover{border-color:var(--iris);color:var(--iris);background:var(--iris-soft)}
.retry-box{margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.retry-btn{padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid rgba(205,43,49,.28);color:var(--red);font-size:11.5px;font-weight:600;flex:none}
.retry-btn:hover{background:var(--red);color:#fff}

.doc-line,.m-preview,.comp-table td{overflow-wrap:anywhere}
.comp-scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.comp-table th:first-child,.comp-table td:first-child{position:sticky;left:0;background:var(--surface);z-index:2;min-width:170px}
.offline-bar{margin:0 0 16px;padding:9px 14px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.pdf-viewer{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.pdf-bar{padding:8px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);background:var(--subtle)}
.pdf-sheet{margin:18px auto;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:var(--shadow-card);transition:transform .15s ease;transform-origin:top center}
.pdf-sheet-head{border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end}

/* Half-screen responsive (e.g. 700px-1080px: Left Feishu Video + Right Resume) */
@media(max-width:1080px){
  .shell{grid-template-columns:56px 0px 1fr !important}
  .space-rail{padding:0 8px;align-items:center}
  .rail-brand{padding:0;justify-content:center}
  .brand-identity,.rail-lbl,.rail-cnt,.rail-jobs{display:none}
  .rail-nav{width:100%;align-items:center;gap:6px}
  .rail-btn{width:38px;height:38px;padding:0;justify-content:center;border-radius:10px}
  .rail-foot{flex-direction:column;align-items:center;gap:6px;padding:12px 0;width:100%}
  .chat-col{position:fixed;left:56px;top:0;bottom:0;width:min(340px,calc(100vw - 56px));box-shadow:var(--shadow-modal);z-index:50;transform:translateX(0);opacity:1;pointer-events:auto;transition:transform .2s ease,opacity .18s ease}
  [data-chat="collapsed"] .chat-col{transform:translateX(-110%);opacity:0;pointer-events:none}
  .canvas-body{padding:24px 24px 64px}
  .canvas-head{padding:0 24px}
}
</style>
</head>
<body>

<div class="shell">
  <!-- 1. Left Slim Space Rail (Strictly Level-1 Spaces + Direct Job Links) -->
  <aside class="space-rail" aria-label="一级空间导航">
    <div class="rail-brand">
      <div class="brand-identity">
        <span class="brand-dot"><svg viewBox="0 0 24 24"><path d="M12 2.5 14.3 9l6.5 2.3-6.5 2.3L12 20.1l-2.3-6.5L3.2 11.3 9.7 9 12 2.5Z"/></svg></span>
        <span style="white-space:nowrap">Recruitment OS</span>
      </div>
      <button class="icon-btn" id="collapse-rail-btn" title="收起 / 展开导航栏 (\)" aria-label="收起或展开导航栏">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <nav class="rail-nav">
      <button class="rail-btn active" data-space="inbox" title="今日待办">
        <span class="rail-btn-l"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/></svg><span class="rail-lbl">今日待办</span></span>
        <span class="rail-cnt num" id="cnt-inbox">0</span>
      </button>

      <button class="rail-btn" data-space="jobs" title="在招岗位">
        <span class="rail-btn-l"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span class="rail-lbl">在招岗位</span></span>
        <span class="rail-cnt num" id="cnt-jobs">0</span>
      </button>

      <div class="rail-jobs" id="rail-jobs"></div>

      <button class="rail-btn" data-space="talent" title="人才库">
        <span class="rail-btn-l"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></svg><span class="rail-lbl">人才库</span></span>
        <span class="rail-cnt num" id="cnt-talent">0</span>
      </button>
    </nav>

    <div class="rail-foot">
      <button class="icon-btn" id="toggle-chat-rail" title="收起 / 展开对话栏 [" aria-label="收起或展开对话栏">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="切换深浅色" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="连接与自动化设置" aria-label="连接与自动化设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1Z"/></svg>
      </button>
      <button class="icon-btn" id="shortcuts-btn" title="快捷键 ?" aria-label="快捷键">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><path d="M12 17h.01"/></svg>
      </button>
    </div>
  </aside>

  <!-- 2. Collapsible Accompanying Agent Dialogue Column -->
  <section class="chat-col" id="chat-col">
    <div class="chat-resizer" id="chat-resizer" title="拖拽调节对话栏宽度，双击还原默认"></div>
    <div class="drop-overlay"><span>松开鼠标，Agent 立即解析简历并建档</span></div>
    <header class="chat-head">
      <span class="chat-title">
        <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--iris)"><path d="M12 2.5 14.3 9l6.5 2.3-6.5 2.3L12 20.1l-2.3-6.5L3.2 11.3 9.7 9 12 2.5Z"/></svg>
        Agent
      </span>
      <button class="icon-btn" id="collapse-chat-btn" title="收起对话栏 [" aria-label="收起对话栏">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </header>

    <div class="chat-stream" id="chat-stream"></div>
    <div class="quick-list" id="quick-list"></div>

    <div class="composer-wrap">
      <div class="composer">
        <button class="icon-btn" id="attach-resume-btn" title="导入或模拟拖入简历 PDF" aria-label="导入简历" style="width:26px;height:26px;margin-left:-4px">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input type="file" id="resume-file-input" accept=".pdf,.doc,.docx,.txt" style="display:none">
        <input id="chat-input" placeholder="告诉 Agent 你想做什么，或点左侧 ＋ 导入简历…">
        <button class="send-circle" id="chat-send" aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- 3. Contextual Main White Canvas (Top bar adapts strictly to active space!) -->
  <section class="canvas-col">
    <header class="canvas-head" id="canvas-head"></header>
    <div class="canvas-body">
      <div class="canvas-inner" id="canvas-inner"></div>
    </div>
  </section>
</div>

<div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo" style="color:#A5B4FC;font-weight:600;display:none">撤销</button></div>

<script src="./data/mock.js"></script>
<script src="./data/adapter.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id);

const urlParams=new URLSearchParams(window.location.search||'');
const apiMode=urlParams.get('mode')||window.__ROS_API_MODE__||'mock';
const apiBaseUrl=urlParams.get('baseUrl')||window.__ROS_API_BASE_URL__||'';
const api=window.createApi({mode:apiMode,baseUrl:apiBaseUrl});

let roles=[];
let candidates=[];
let autoDone=[];
let nudgePending=false;
let nudgeItem={interviewer:'',roleLabel:'',overdueLabel:'',draftText:''};
let messages=[];
let connectors=[];
let autoRules=[];
let slaConfig={screenH:24,scorecardH:12,offerH:72,batchThankYou:true};
let uiOptions={rejectReasons:[],rescheduleSlots:[],addRoundSlots:[],compoundSlots:[],defaultDemoPdf:'',defaultQuickPills:[]};

// Progressive Navigation State
let space='inbox'; // 'inbox' | 'jobs' | 'talent'
let inboxTab='pending'; // 'pending' | 'autodone'
let activeJobId=null; // null = all jobs 6-stage flow; string = specific job
let jobTab='pipeline'; // 'pipeline' | 'compare' | 'rubric'
let jobStageFilter='全部';
let activeCandId=null; // non-null = drilled into candidate inside job
let talentTab='all'; // 'all' | 'risk' | 'archived'
let talentQuery='';
let roleView='hr';
let activeCrit='c1',docTab='resume',autoAdvance=false,timelineOpen=false;
let expandedTs=null,settingsTab='connectors';
let asyncTask=null,pendingRetry=null;
let jobsExpanded=false,pdfZoom=100,isOffline=!navigator.onLine;
let selectedIds=new Set();
let modalState=null,modalEdit=false,undoSnap=null;

const getRole=id=>roles.find(r=>r.id===id)||roles[0]||{id:'',name:'',dept:'',hcTotal:0,hcFilled:0,rubric:[],jd:{}};
const getCand=id=>candidates.find(c=>c.id===id);
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};

function handleApiError(err){
  if(err&&err.code==='NOT_AVAILABLE'){
    showToast('这项暂时还没接通');
    return;
  }
  showToast((err&&err.userMessage)||'暂时无法完成该操作，请稍后再试');
}

function syncCandidateFromApi(updated){
  if(!updated||!updated.id)return;
  const idx=candidates.findIndex(x=>x.id===updated.id);
  if(idx>=0)candidates[idx]=updated;
  else candidates.unshift(updated);
}

function syncRoleFromApi(updated){
  if(!updated||!updated.id)return;
  const idx=roles.findIndex(x=>x.id===updated.id);
  if(idx>=0)roles[idx]=updated;
  else roles.unshift(updated);
}

async function safeSubmit(actionName,payload){
  try{
    return await api.submit(actionName,payload);
  }catch(err){
    handleApiError(err);
    return null;
  }
}

function getFocusCands(){
  return candidates.filter(c=>{
    if(c.stage==='已结束'||c.stage==='录用归档')return false;
    if(roleView==='interviewer')return c.stage.includes('面');
    if(roleView==='hm')return c.stage==='初筛评估'||c.stage==='三面终审';
    return true;
  });
}

function showToast(msg,undo=false){
  $('toast-msg').textContent=msg;
  $('toast-undo').style.display=undo?'inline-block':'none';
  $('toast').classList.add('show');
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>{$('toast').classList.remove('show');undoSnap=null;},undo?5000:2500);
}
function snap(){undoSnap={roles:JSON.parse(JSON.stringify(roles)),candidates:JSON.parse(JSON.stringify(candidates)),nudgePending};}
$('toast-undo').onclick=async()=>{
  if(!undoSnap)return;
  const prev=undoSnap;
  const res=await safeSubmit('restore_snapshot',prev);
  if(!res)return;
  roles=prev.roles;candidates=prev.candidates;nudgePending=prev.nudgePending;undoSnap=null;
  $('toast').classList.remove('show');render();showToast('已撤销上一步操作');
};

function setChatCollapsed(col){
  if(col)document.documentElement.dataset.chat='collapsed';
  else delete document.documentElement.dataset.chat;
  $('toggle-chat-rail').title=col?'展开对话栏 [':'收起对话栏 [';
  try{localStorage.setItem('ros-v4-chat',col?'collapsed':'open');}catch(e){}
}
function setRailCollapsed(col){
  if(col)document.documentElement.dataset.rail='collapsed';
  else delete document.documentElement.dataset.rail;
  try{localStorage.setItem('ros-v4-rail',col?'collapsed':'open');}catch(e){}
}

async function openCandidate(candId){
  let c=getCand(candId);
  if(api.mode==='http'){
    try{
      const fresh=await api.getApplication(candId);
      if(fresh){syncCandidateFromApi(fresh);c=fresh;}
    }catch(err){handleApiError(err);}
  }
  if(!c)return;
  space='jobs';activeJobId=c.roleId;activeCandId=c.id;activeCrit='c1';docTab='resume';timelineOpen=false;
  render();
}

function advanceNextIfEnabled(prevCand){
  if(!autoAdvance)return;
  const next=candidates.find(c=>c.roleId===prevCand.roleId&&c.id!==prevCand.id&&c.stage!=='已结束'&&c.stage!=='录用归档');
  if(next){activeCandId=next.id;activeCrit='c1';docTab='resume';}
}

function ingestDemoResume(fileInput){
  const fileName=typeof fileInput==='string'?fileInput:(fileInput&&fileInput.name)||uiOptions.defaultDemoPdf;
  const baseName=fileName.split('_')[0].replace(/\.(pdf|docx?|txt)$/i,'')||fileName;
  asyncTask={status:'running',fileName,name:baseName,candId:null};
  renderCanvas();
  showToast(`已加入后台解析队列：「${fileName}」（不阻塞当前审阅）`);
  setTimeout(async()=>{
    try{
      snap();
      const res=await api.uploadResume(fileInput||fileName,activeJobId||(roles[0]&&roles[0].id)||'pm');
      if(res&&res.candidate){
        syncCandidateFromApi(res.candidate);
        if(res.autoEntry)autoDone.unshift(res.autoEntry);
        asyncTask={status:'done',fileName:res.fileName||fileName,name:res.candidate.name,candId:res.candidate.id};
        messages.push({role:'ai',text:`后台已完成「${fileName}」解析并建档：${res.candidate.name} 4/4 核心标准全部命中，可随时点右侧提示查看。`,tag:'后台解析完成'});
        render();
        showToast(`后台解析完成：${res.candidate.name} 已入库`,true);
      }
    }catch(err){
      asyncTask=null;renderCanvas();handleApiError(err);
    }
  },1100);
}

// 1. Render Left Space Rail
function renderRail(){
  const pendingCount=getFocusCands().length+(nudgePending&&roleView==='hr'?1:0);
  $('cnt-inbox').textContent=pendingCount;
  $('cnt-jobs').textContent=roles.length;
  $('cnt-talent').textContent=candidates.length;

  document.querySelectorAll('.rail-btn[data-space]').forEach(b=>{
    const isJobsOverview=b.dataset.space==='jobs'&&space==='jobs'&&!activeJobId;
    const isOther=b.dataset.space!=='jobs'&&space===b.dataset.space;
    b.classList.toggle('active',isJobsOverview||isOther);
  });

  const visibleRoles=jobsExpanded?roles:roles.slice(0,5);
  $('rail-jobs').innerHTML=visibleRoles.map(r=>`
    <button class="rail-job ${space==='jobs'&&activeJobId===r.id?'active':''}" data-rail-job="${r.id}">
      <span class="rail-job-name">${r.name}</span>
      <span class="rail-job-hc num">${r.hcFilled}/${r.hcTotal}</span>
    </button>`).join('')
    +(roles.length>5?`<button class="rail-job" id="rail-more-jobs" style="color:var(--soft)">${jobsExpanded?'收起其余岗位 ▴':`展开其余 ${roles.length-5} 个岗位 ▾`}</button>`:'')
    +`<button class="rail-job" id="rail-new-job" style="color:var(--soft)">＋ 新建岗位</button>`;
  $('rail-more-jobs')?.addEventListener('click',()=>{jobsExpanded=!jobsExpanded;renderRail();});

  $('rail-jobs').querySelectorAll('[data-rail-job]').forEach(b=>b.onclick=async()=>{
    const jid=b.dataset.railJob;
    if(api.mode==='http'){
      try{
        const res=await api.getJob(jid);
        if(res&&res.job)syncRoleFromApi(res.job);
        if(res&&Array.isArray(res.candidates))res.candidates.forEach(syncCandidateFromApi);
      }catch(err){handleApiError(err);}
    }
    space='jobs';activeJobId=jid;activeCandId=null;jobTab='pipeline';jobStageFilter='全部';selectedIds.clear();render();
  });
  $('rail-new-job').onclick=()=>openModal({type:'new_job',name:''});
}

// 2. Render Accompanying Agent Chat
function renderChat(){
  $('chat-stream').innerHTML=messages.map((m,mi)=>m.thinking
    ?`<div class="msg ai"><div class="thinking-row"><i class="thinking-dot"></i><span>${m.text}</span></div></div>`
    :`<div class="msg ${m.role}">
      <div>${m.text}</div>
      ${m.tag?`<div class="msg-action-tag">${m.tag}</div>`:''}
      ${m.disambig?`<div class="disambig-row">${m.disambig.map(opt=>`<button class="disambig-btn" data-dis-cand="${opt.id}" data-dis-cmd="${m.origCmd}">${opt.label}</button>`).join('')}</div>`:''}
      ${m.retryId?`<div class="retry-box"><span>防重保护已启用 · 恢复连接后安全重试</span><button class="retry-btn" data-retry-msg="${mi}">重连并重试</button></div>`:''}
    </div>`).join('');
  $('chat-stream').querySelectorAll('[data-dis-cand]').forEach(b=>b.onclick=()=>{
    const chosen=getCand(b.dataset.disCand);
    if(!chosen)return;
    openCandidate(chosen.id);
    handleCommand(b.dataset.disCmd.replace(/林同学|林/g,chosen.name));
  });
  $('chat-stream').querySelectorAll('[data-retry-msg]').forEach(b=>b.onclick=async()=>{
    if(!pendingRetry)return;
    const act=pendingRetry.run;
    const connId=pendingRetry.connId;
    pendingRetry=null;
    const conn=connectors.find(x=>x.id===connId);
    if(conn)conn.connected=true;
    await act();
    render();
    showToast('外部连接已恢复，安全重试成功（防重校验通过）');
  });
  $('chat-stream').scrollTop=$('chat-stream').scrollHeight;

  const c=activeCandId?getCand(activeCandId):null;
  const pills=c&&c.stage==='初筛评估'
    ?[`通过${c.name}初筛，标字节 Offer 周五截止并约明天下午 3 点一面`,`把${c.name}调剂去 Java 岗`]
    :c&&c.stage==='三面终审'
    ?[`给${c.name}发 Offer，P7 45k`,`给${c.name}加一轮交叉面`]
    :(uiOptions.defaultQuickPills||[]);
  $('quick-list').innerHTML=pills.map(p=>`<button class="q-pill" data-qp="${p}">${p}</button>`).join('');
  $('quick-list').querySelectorAll('[data-qp]').forEach(b=>b.onclick=()=>handleCommand(b.dataset.qp));
}

// 3. Render Contextual Top Bar + Main Canvas
function renderCanvas(){
  const head=$('canvas-head');
  const inner=$('canvas-inner');

  const roleSelHTML=`<select class="quiet-select" id="role-view-sel" aria-label="切换视角">
    <option value="hr" ${roleView==='hr'?'selected':''}>HR 推进</option>
    <option value="hm" ${roleView==='hm'?'selected':''}>用人经理</option>
    <option value="interviewer" ${roleView==='interviewer'?'selected':''}>面试官</option>
  </select>`;

  // ---- SPACE 1: 今日待办 ----
  if(space==='inbox'){
    const focusCands=getFocusCands();
    const activeAuto=autoDone.filter(x=>!x.undone);
    head.innerHTML=`
      <div class="canvas-head-left">
        <div class="canvas-tabs">
          <button class="c-tab ${inboxTab==='pending'?'active':''}" data-itab="pending">等你拍板 <span class="num" style="color:var(--soft);margin-left:3px">${focusCands.length+(nudgePending&&roleView==='hr'?1:0)}</span></button>
          <button class="c-tab ${inboxTab==='autodone'?'active':''}" data-itab="autodone">Agent 已代办 <span class="num" style="color:var(--soft);margin-left:3px">${activeAuto.length}</span></button>
        </div>
      </div>
      <div class="canvas-right-meta">${roleSelHTML}</div>`;

    if(inboxTab==='pending'){
      inner.innerHTML=`
        <div>
          <div class="sec-head"><span class="sec-title">需要你拍板</span><span class="sec-meta">点击直接进入对应决策画布</span></div>
          <div class="clean-list">
            ${focusCands.map(c=>{
              const cls=c.stage==='初筛评估'&&c.hours>=24?'red':c.stage==='三面终审'?'amber':c.offerStatus==='SENT'?'green':'iris';
              const st=c.stage==='初筛评估'&&c.hours>=24?`初筛 · ${c.hours}h 超时`:c.stage;
              return `<div class="clean-row" data-pick-c="${c.id}">
                <div class="cr-left"><span class="mono">${c.name.slice(0,1)}</span><span class="cr-name">${c.name}<span class="cr-role">${getRole(c.roleId).name}</span></span></div>
                <span class="cr-status ${cls} num">${st}</span>
              </div>`;
            }).join('')}
            ${nudgePending&&roleView==='hr'?`
            <div class="clean-row" id="pick-nudge">
              <div class="cr-left"><span class="mono" style="background:var(--red-soft);color:var(--red)">催</span><span class="cr-name">${nudgeItem.interviewer}<span class="cr-role">${nudgeItem.roleLabel}</span></span></div>
              <span class="cr-status red num">${nudgeItem.overdueLabel}</span>
            </div>`:''}
          </div>
        </div>`;
      inner.querySelectorAll('[data-pick-c]').forEach(el=>el.onclick=()=>openCandidate(el.dataset.pickC));
      $('pick-nudge')?.addEventListener('click',()=>openModal({type:'nudge'}));
    }else{
      inner.innerHTML=`
        <div>
          <div class="sec-head"><span class="sec-title">今日 Agent 已静默代办</span><span class="sec-meta">随时可抽检或撤回</span></div>
          <div class="clean-list">
            ${autoDone.map(a=>`
              <div class="clean-row" style="cursor:default;${a.undone?'opacity:.45':''}">
                <span style="font-size:13px;color:var(--text)"><span style="color:var(--soft);margin-right:10px" class="num">${a.t}</span>${a.undone?`<s>${a.text}</s>`:a.text}</span>
                ${!a.undone?`<button class="text-link" data-undo-a="${a.id}">撤回</button>`:`<span class="sec-meta">已撤回</span>`}
              </div>`).join('')}
          </div>
        </div>`;
      inner.querySelectorAll('[data-undo-a]').forEach(b=>b.onclick=async()=>{
        const res=await safeSubmit('undo_auto_done',{id:b.dataset.undoA});
        if(!res)return;
        const it=autoDone.find(x=>x.id===b.dataset.undoA);if(it){it.undone=true;render();showToast('已撤回该条 Agent 代办');}
      });
    }
    head.querySelectorAll('[data-itab]').forEach(b=>b.onclick=()=>{inboxTab=b.dataset.itab;renderCanvas();});
  }

  // ---- SPACE 2A: 在招岗位总览（6 阶段横向进度图） ----
  else if(space==='jobs'&&!activeJobId){
    const totalHC=roles.reduce((s,r)=>s+r.hcTotal,0),filledHC=roles.reduce((s,r)=>s+r.hcFilled,0);
    const stageLabels=['标准','接入','初筛','面试','终审','Offer'];
    head.innerHTML=`
      <div class="canvas-head-left"><span style="font-size:14px;font-weight:650">在招岗位 · 全流程进度</span></div>
      <div class="canvas-right-meta"><span class="num">总 HC ${filledHC} / ${totalHC}</span>${roleSelHTML}</div>`;

    inner.innerHTML=`
      <div class="flow-list" style="border-top:0">
        ${roles.map(r=>{
          const list=candidates.filter(c=>c.roleId===r.id&&c.stage!=='已结束');
          const sS=list.filter(c=>c.stage==='初筛评估').length;
          const sI=list.filter(c=>c.stage.includes('面')&&c.stage!=='三面终审').length;
          const sF=list.filter(c=>c.stage==='三面终审').length;
          const sO=list.filter(c=>c.stage==='Offer 待确认'||c.stage==='录用归档').length;
          const cur=sO?5:sF?4:sI?3:sS?2:1;
          return `<div class="flow-row" data-open-job="${r.id}">
            <div class="flow-top">
              <span class="flow-job-name">${r.name} <span style="font-size:12px;font-weight:400;color:var(--muted);margin-left:6px">${r.dept}</span></span>
              <span class="flow-hc num">${r.hcFilled} / ${r.hcTotal} HC</span>
            </div>
            <div class="stage-track">
              ${stageLabels.map((lbl,i)=>{
                const cls=i<cur?'done':i===cur?(sS||sF?'wait':'now'):'';
                return `<div class="st-node ${cls}"><div class="st-dot">${cls==='done'?'✓':cls==='wait'?'!':cls==='now'?'•':''}</div><span class="st-lbl">${lbl}</span></div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    inner.querySelectorAll('[data-open-job]').forEach(el=>el.onclick=async()=>{
      const jid=el.dataset.openJob;
      if(api.mode==='http'){
        try{
          const res=await api.getJob(jid);
          if(res&&res.job)syncRoleFromApi(res.job);
          if(res&&Array.isArray(res.candidates))res.candidates.forEach(syncCandidateFromApi);
        }catch(err){handleApiError(err);}
      }
      activeJobId=jid;jobTab='pipeline';jobStageFilter='全部';selectedIds.clear();render();
    });
  }

  // ---- SPACE 2B: 具体岗位内部（自然承接：候选人漏斗 | 同池对比 | 岗位标准 V1） ----
  else if(space==='jobs'&&activeJobId&&!activeCandId){
    const r=getRole(activeJobId);
    head.innerHTML=`
      <div class="canvas-head-left">
        <div class="crumb-bar"><button class="crumb-link" id="bc-all-jobs">在招岗位</button><span>/</span><span class="crumb-cur">${r.name}</span></div>
        <div class="canvas-tabs" style="margin-left:8px">
          <button class="c-tab ${jobTab==='pipeline'?'active':''}" data-jtab="pipeline">候选人漏斗</button>
          <button class="c-tab ${jobTab==='compare'?'active':''}" data-jtab="compare">同池对比</button>
          <button class="c-tab ${jobTab==='rubric'?'active':''}" data-jtab="rubric">岗位标准 V1</button>
        </div>
      </div>
      <div class="canvas-right-meta"><span class="num">${r.hcFilled} / ${r.hcTotal} HC</span>${roleSelHTML}</div>`;

    if(jobTab==='pipeline'){
      const allList=candidates.filter(c=>c.roleId===r.id);
      const filters=['全部','初筛','面试中','终审与 Offer','已结束'];
      const list=allList.filter(c=>{
        if(jobStageFilter==='全部')return true;
        if(jobStageFilter==='初筛')return c.stage==='初筛评估';
        if(jobStageFilter==='面试中')return c.stage.includes('面')&&c.stage!=='三面终审';
        if(jobStageFilter==='终审与 Offer')return c.stage==='三面终审'||c.stage==='Offer 待确认'||c.stage==='录用归档';
        return c.stage==='已结束';
      });
      inner.innerHTML=`
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div style="display:flex;gap:16px">${filters.map(f=>`<button class="text-link ${jobStageFilter===f?'active':''}" data-jf="${f}">${f}</button>`).join('')}</div>
            <span class="sec-meta num">${list.length} 人</span>
          </div>
          ${list.length?`
          <div class="clean-list">
            ${list.map(c=>`
              <div class="clean-row" data-pick-c="${c.id}">
                <div class="cr-left">
                  <input type="checkbox" data-chk="${c.id}" ${selectedIds.has(c.id)?'checked':''} style="cursor:pointer">
                  <span class="mono">${c.name.slice(0,1)}</span>
                  <span class="cr-name">${c.name}${c.starred?' ★':''}<span class="cr-role">${c.edu} · ${c.exp}</span></span>
                </div>
                <span class="cr-status ${c.stage==='初筛评估'&&c.hours>=24?'red':c.stage==='已结束'?'':'iris'} num">${c.stage}</span>
              </div>`).join('')}
          </div>`:`<div style="padding:48px 0;text-align:center;color:var(--muted)">当前阶段暂无候选人</div>`}
          ${selectedIds.size?`
          <div class="batch-float">
            <span class="num">已选 ${selectedIds.size} 人</span>
            <div style="display:flex;gap:8px">
              <button id="b-comp">进入同池对比</button>
              <button id="b-rej" style="background:var(--red);color:#fff">批量不通过</button>
              <button id="b-clr">取消</button>
            </div>
          </div>`:''}
        </div>`;
      inner.querySelectorAll('[data-jf]').forEach(b=>b.onclick=()=>{jobStageFilter=b.dataset.jf;selectedIds.clear();renderCanvas();});
      inner.querySelectorAll('[data-chk]').forEach(chk=>{
        chk.onclick=e=>e.stopPropagation();
        chk.onchange=()=>{if(chk.checked)selectedIds.add(chk.dataset.chk);else selectedIds.delete(chk.dataset.chk);renderCanvas();};
      });
      inner.querySelectorAll('[data-pick-c]').forEach(el=>el.onclick=()=>openCandidate(el.dataset.pickC));
      $('b-clr')?.addEventListener('click',()=>{selectedIds.clear();renderCanvas();});
      $('b-comp')?.addEventListener('click',()=>{jobTab='compare';renderCanvas();});
      $('b-rej')?.addEventListener('click',()=>openModal({type:'batch_reject',ids:[...selectedIds],reason:(uiOptions.rejectReasons||[])[0]||'核心项目深度不足'}));
    }else if(jobTab==='compare'){
      const pool=selectedIds.size>=2?[...selectedIds].map(getCand).filter(Boolean):candidates.filter(c=>c.roleId===r.id&&c.stage!=='已结束');
      const mixed=new Set(pool.map(x=>x.stage)).size>1;
      inner.innerHTML=`
        <div>
          ${mixed?`<div class="risk-note" style="margin-bottom:18px">当前包含不同阶段候选人，正式录用决策建议优先对齐同一节点。</div>`:''}
          ${pool.length?`
          <div class="comp-scroll"><table class="comp-table">
            <thead>
              <tr>
                <th style="width:185px">考核维度</th>
                ${pool.map(p=>`<th><button class="text-link" data-pick-c="${p.id}" style="color:var(--ink);font-weight:650;font-size:14px">${p.name}${p.starred?' ★':''}</button><div style="font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px">${p.stage}</div></th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${(pool[0].criteria||[]).map((cr,i)=>`<tr>
                <td style="color:var(--muted)">0${i+1} ${cr.t}</td>
                ${pool.map(p=>{
                  const it=(p.criteria||[])[i]||{lv:'amber',s:'—'};
                  return `<td><span class="cr-status ${it.lv==='green'?'green':it.lv==='amber'?'amber':'red'}">${it.s}</span></td>`;
                }).join('')}
              </tr>`).join('')}
              <tr>
                <td style="color:var(--muted)">核心提炼</td>
                ${pool.map(p=>`<td style="color:var(--text);line-height:1.6">${p.summary}</td>`).join('')}
              </tr>
            </tbody>
          </table></div>`:`<div style="padding:48px 0;text-align:center;color:var(--muted)">该岗位暂无可对比候选人</div>`}
        </div>`;
      inner.querySelectorAll('[data-pick-c]').forEach(el=>el.onclick=()=>openCandidate(el.dataset.pickC));
    }else{
      const jd=r.jd||{meta:`${r.dept} · 全职`,duties:'负责核心业务从 0 到 1 推进与跨团队落地。',reqs:'具备扎实的专业背景与真实项目交付记录。',bonus:'有复杂系统实战经验者优先。'};
      inner.innerHTML=`
        <div>
          <div class="sec-head"><span class="sec-title">考核维度与标准 V1（已锁定）</span><span class="sec-meta">${r.dept}</span></div>
          <div class="clean-list">
            ${(r.rubric||[]).map((rb,i)=>`
              <div class="clean-row" style="cursor:default">
                <span style="font-size:14px;color:var(--ink)"><span class="num" style="color:var(--soft);margin-right:10px">0${i+1}</span>${rb}</span>
                <span class="cr-status green">生效中</span>
              </div>`).join('')}
          </div>
        </div>

        <div>
          <div class="sec-head"><span class="sec-title">岗位原始信息（完整 JD）</span><span class="sec-meta">${jd.meta}</span></div>
          <div class="jd-box">
            <div><div class="jd-sec-t">岗位职责</div><div style="white-space:pre-line">${jd.duties}</div></div>
            <div><div class="jd-sec-t">任职要求</div><div style="white-space:pre-line">${jd.reqs}</div></div>
            <div><div class="jd-sec-t">加分项</div><div>${jd.bonus}</div></div>
          </div>
        </div>`;
    }
    $('bc-all-jobs').onclick=()=>{activeJobId=null;render();};
    head.querySelectorAll('[data-jtab]').forEach(b=>b.onclick=()=>{jobTab=b.dataset.jtab;renderCanvas();});
  }

  // ---- SPACE 2C: 具体候选人（面包屑层层递进：岗位 / 阶段 / 候选人） ----
  else if(space==='jobs'&&activeJobId&&activeCandId){
    const c=getCand(activeCandId),r=getRole(c.roleId);
    const pool=candidates.filter(x=>x.roleId===r.id);
    const idx=pool.findIndex(x=>x.id===c.id);
    const isScreen=c.stage==='初筛评估';
    const isLocked=c.stage==='已结束'||c.stage==='录用归档';

    head.innerHTML=`
      <div class="canvas-head-left">
        <div class="crumb-bar">
          <button class="crumb-link" id="bc-job-back">${r.name}</button>
          <span>/</span><span>${c.stage}</span><span>/</span>
          <span class="crumb-cur">${c.name}</span>
        </div>
      </div>
      <div class="canvas-right-meta">
        <div class="stepper">
          <button id="prev-c" title="上一位 (P)">‹</button>
          <span class="num">${idx+1}/${pool.length}</span>
          <button id="next-c" title="下一位 (N)">›</button>
        </div>
        <button id="star-cand" title="主推标记" style="font-size:15px;color:${c.starred?'var(--amber)':'var(--soft)'}">${c.starred?'★':'☆'}</button>
        ${roleSelHTML}
      </div>`;

    if(roleView==='interviewer'){
      inner.innerHTML=`
        <div class="doc-head">
          <div><div class="doc-name">${c.name}</div><div class="doc-meta">${r.name} · ${c.edu} · ${c.exp}</div></div>
          <span class="cr-status iris">面试官简报</span>
        </div>
        <div class="doc-block">
          <div class="sec-meta">建议追问（参考非指令）</div>
          <div>${c.iqs.map((q,i)=>`<label class="iq-row ${q.done?'done':''}"><input type="checkbox" data-iq="${i}" ${q.done?'checked':''} style="margin-top:4px"><span>${q.fromHandoff?`<span class="ts-badge">前序交接</span>`:''}${q.t}</span></label>`).join('')}</div>
        </div>
        <div class="doc-block">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span class="sec-meta">面后速记（将结合飞书妙记自动整理）</span>
            <span class="sec-meta" id="notes-save-hint" style="color:var(--green)">${c.notes?'已自动暂存本地':''}</span>
          </div>
          <textarea class="clean-notes" id="int-notes" placeholder="随手记几句现场表现或顾虑，输入即自动暂存本地防断网丢稿…">${c.notes||''}</textarea>
        </div>
        <div class="doc-foot">
          <span class="sec-meta">独立面评 · 不受他人打分影响</span>
          <button class="btn dark" id="btn-submit-sc">生成结构化面评</button>
        </div>`;
      inner.querySelectorAll('[data-iq]').forEach(chk=>chk.onchange=async()=>{
        const i=Number(chk.dataset.iq);
        c.iqs[i].done=chk.checked;
        renderCanvas();
        if(api.mode==='mock')await safeSubmit('toggle_iq',{candId:c.id,index:i,done:chk.checked});
      });
      $('int-notes').oninput=e=>{
        c.notes=e.target.value;
        try{localStorage.setItem('ros-v4-notes-'+c.id,c.notes);}catch(err){}
        const h=$('notes-save-hint');if(h)h.textContent=c.notes?`已自动暂存本地 (${nowHM()})`:'';
        if(api.mode==='mock')api.submit('save_notes',{candId:c.id,notes:c.notes}).catch(()=>{});
      };
      $('btn-submit-sc').onclick=()=>openModal({type:'scorecard',candId:c.id,summary:c.notes.trim()||'核心能力扎实，建议推进下一轮。'});
    }else{
      let lineIdx=0;
      const resumeHTML=docTab==='resume'
        ?c.resumeSections.map(sec=>`
          <div class="resume-group-title">${sec.title}</div>
          ${sec.items.map(it=>{
            lineIdx++;
            const no=lineIdx<10?'0'+lineIdx:String(lineIdx);
            return `<div class="doc-line ${it.k===activeCrit?'active':''}" data-cr="${it.k}">
              <span class="doc-no num">${no}</span>
              <div>
                ${it.co?`<div class="exp-meta"><span class="exp-co">${it.co}</span><span class="exp-time num">${it.time||''}</span></div>`:''}
                <div>${it.t}</div>
              </div>
            </div>`;
          }).join('')}`).join('')
        :docTab==='pdf'
        ?`<div class="pdf-viewer">
            <div class="pdf-bar">
              <span>${c.name}_${r.name.split('（')[0]}.pdf · 原件视图（支持 PDF / 图片 / Word 二进制流）</span>
              <div style="display:flex;align-items:center;gap:8px">
                <button class="text-link" id="pdf-zoom-out">－</button>
                <span class="num">${pdfZoom}%</span>
                <button class="text-link" id="pdf-zoom-in">＋</button>
              </div>
            </div>
            <div style="padding:12px 16px;overflow:auto">
              ${c.materialUrl&&api.mode==='http'
                ?`<iframe src="${c.materialUrl}" title="${c.name} 原件" style="width:100%;height:560px;border:0;border-radius:6px;background:var(--surface)"></iframe>`
                :`<div class="pdf-sheet" style="transform:scale(${pdfZoom/100})">
                <div class="pdf-sheet-head">
                  <div><div style="font-size:18px;font-weight:700">${c.name}</div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">${c.edu} · ${c.exp}</div></div>
