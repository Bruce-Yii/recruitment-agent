function parseGoal(goal){const numToken=goal.match(/(?:招聘|招募|招|寻找|需要|计划招|计划招聘)\s*([一二三四五六七八九十两0-9]+)\s*[个名位人]?/);const numerals={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};let target=null;if(numToken){const v=numToken[1];target=/^\d+$/.test(v)?Number(v):(numerals[v]||(/十/.test(v)?10:null))}const stripped=goal.replace(/^(?:帮我|我们|希望|计划|想要|想|请|目前|现在|给公司|给团队|为团队)[，,\s]*/,'').replace(/^(?:招聘|招募|招|寻找|需要|计划招聘|计划招)\s*([一二三四五六七八九十两0-9]+\s*[个名位人]?)?/,'').trim();let candidate=stripped.split(/[，,。；;\n]/)[0].split(/(?:，负责|主要负责|重点考察|要求|能够|从事|并且)/)[0].trim();candidate=candidate.replace(/^(?:一名|一位|几名|若干|一个)\s*/,'').replace(/\s*(?:人才|岗位)\s*$/,'').trim();if(candidate.length>36)candidate=candidate.slice(0,36);if(!candidate||candidate.length<2||/^[做能有需要]+$/.test(candidate))candidate='岗位名称待确认';return {name:candidate,target:target&&target>=1&&target<=100?target:null}}

const browserFiles=new Map();
function openFilesDB(){return new Promise((resolve,reject)=>{try{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open('recruitment-agent-v52-local-files',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('assets'))req.result.createObjectStore('assets')};req.onerror=()=>reject(req.error||new Error('IndexedDB failed'));req.onsuccess=()=>resolve(req.result)}catch(e){reject(e)}})}
async function storeOriginal(id,file){browserFiles.set(id,file);try{const db=await openFilesDB();await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();return true}catch(_){return false}}
async function readOriginal(id){if(browserFiles.has(id))return browserFiles.get(id);try{const db=await openFilesDB();const file=await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readonly');const req=tx.objectStore('assets').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return file}catch(_){return null}}
async function downloadOriginal(a){if(!a)return;const file=await readOriginal(a.id);if(!file){notify('原始文件在当前浏览器中不可用，请重新导入；业务元数据仍可查看');return}const url=URL.createObjectURL(file);const node=document.createElement('a');node.href=url;node.download=a.resume;document.body.appendChild(node);node.click();node.remove();setTimeout(()=>URL.revokeObjectURL(url),12000)}
function flow(a){const names=['简历接入','初筛','面试','评价与决策','Offer 准备'];const terminal=['rejected','hold'].includes(a.state);let n=['intake','screening','awaiting_agent'].includes(a.state)?0:a.state==='screened'?1:a.state==='interview'?2:a.state==='review'?3:a.state==='offer'?4:1;if(terminal)n=(a.holdOrigin==='review'||a.decisionHistory?.length)?3:1;return `<div class="flowlist">${names.map((name,i)=>{const done=i<n;const active=i===n;return `<div class="flowstep ${done?'done':active?'now':''}"><span class="flowmark">${done?'✓':active?'·':''}</span><span><strong>${name}</strong></span></div>`}).join('')}</div>`}

  if(a.state==='interview'){const startAt=a.meeting?.time?new Date(String(a.meeting.time).replace(' ','T')):null;const confirmed=a.meeting?.status==='confirmed';if(!a.meeting)action=`${chip('等待招聘方安排','amber')}<span class="muted tiny">面试安排尚未确认，暂不能记录面试结束。</span>`;else if(!confirmed)action=`${chip(interviewerStatus(a),'blue')}<span class="muted tiny">排期确认不代表面试已经发生；等待真实会议事件或授权人工记录。</span>`;else if(startAt&&!Number.isNaN(startAt.valueOf())&&startAt>new Date())action=`${chip('等待面试开始','blue')}<span class="muted tiny">面试时间未到。</span>`;else action=`${chip('等待真实结束事件','blue')}<span class="muted tiny">Transcript 与面评是独立工作分支；本离线原型不会伪造会议结束事件。</span>`;}
  else if(a.state==='review'&&!submitted)action=`<button class="btn blue" data-role-action="open-score">提交我的独立面评</button>`;
  else if(submitted)action=chip('本轮面评已提交','green');
  else action=chip(nextToDo(a),'blue');
  return `<button class="back" data-action="backwork">← 返回我的面试</button><div class="headline"><div><div class="cap">INTERVIEW WORKSPACE · SAMPLE</div><h1>${esc(person(a).name)}</h1><p class="sub">${esc(job(a.jid).name)} · ${esc(stage.name)} · 当前身份：${roleMeta().name}</p></div>${chip(interviewerStatus(a),'blue')}</div>
  <div class="detailgrid"><div class="min"><section class="paper detailmain"><div class="insight" style="margin-top:0"><h3>本轮面试简报</h3><p>${esc(a.interviewBrief||stage.purpose||'Agent 根据本轮标准准备面试简报。')}</p></div>
  <div class="subhead"><h2>本轮考察重点</h2></div>${stage.focus.map((x,i)=>`<div class="criteria"><span class="dot blue"></span><div class="criteriabody"><strong>${i+1}. ${esc(x)}</strong></div></div>`).join('')}
  <details class="paper collapse" style="margin-top:14px"><summary>建议问题</summary><div class="sourcebox">${esc(stage.questions||'由 Agent 根据本轮考察标准准备')}</div></details>
  ${policy.interviewerCanViewResume!==false?`<details class="paper collapse" style="margin-top:10px"><summary>查看招聘方接收的简历材料</summary><div class="sourcebox">${esc(a.raw||'简历原件需从招聘方材料库读取')}</div></details>`:''}
  ${history&&policy.interviewerCanViewObjective!==false?`<details class="paper collapse" style="margin-top:10px"><summary>前序轮次客观记录</summary><div>${history}</div></details>`:''}
  <div class="divider"></div><div class="inlineactions">${action}</div></section></div>
  <aside class="detailaside"><section class="paper actionbox"><strong>面试安排</strong><p>${esc(a.meeting?.time||'尚未安排')} · ${esc(a.meeting?.mode||'')}</p><p class="muted tiny">面试官：${roleMeta().name} · ${esc(a.meeting?.source||'SAMPLE')}</p></section><section class="paper actionbox"><strong>信息可见范围</strong><p>可查看本轮简历材料、考察标准和授权的前序客观摘要。</p><p class="muted tiny">其他面试官的主观评分和私人备注默认不展示。</p></section></aside></div>`;
}
function interviewerRecordsPage(){
  const entries=[];

    if(a.scorecards?.[ui.actor])entries.push({a,round:currentRound(a),score:a.scorecards[ui.actor]});

function recruiterWorkPage(){
  let x=baseWorkPageV52();
  x=x.replace('<h1>你的招聘工作</h1>','<h1>招聘总览</h1>');
  return x.replace(/<section class="paper asidecard"><div class="flex between"><h2>需要你处理<\/h2>[\s\S]*?(?=<section class="paper asidecard"><h2>其他正在招聘)/,'');

function configWorkspace(){
  const c=data.enterpriseConfig,tab=ui.configTab||'stages';
  const tabs=[['stages','招聘流程'],['rubric','评价标准'],['agent','Agent 执行规则']];
  let body='';
  if(tab==='stages'){
    body=`<div class="sectionhead" style="margin-top:0"><h2>面试阶段与轮次</h2><button class="btn soft sm" data-role-action="add-stage">＋ 添加阶段</button></div>
    <div class="inlineactions" style="margin:10px 0"><span class="muted tiny">从模板开始：</span><button class="btn sm" data-role-action="template-two">通用两轮</button><button class="btn sm" data-role-action="template-product">产品三阶段</button><button class="btn sm" data-role-action="template-tech">技术三阶段</button></div>
    <p class="muted tiny">模板是可编辑起点。企业可按实际流程增删、重命名和调整阶段，不限定一面、二面、三面。配置仅保存为演示草稿。</p>
    ${c.stages.map((s,i)=>`<details class="paper collapse" style="margin-top:10px"><summary>阶段 ${i+1} · ${esc(s.name)} · ${s.scoreCount} 份独立面评</summary><div>
    <div class="field"><label>阶段名称</label><input class="input cfg-name" data-index="${i}" value="${esc(s.name)}"></div>
    <div class="field"><label>阶段目标</label><input class="input cfg-purpose" data-index="${i}" value="${esc(s.purpose)}"></div>
    <div class="field"><label>考察维度（每行一项）</label><textarea class="textarea cfg-focus" data-index="${i}" rows="3">${esc(s.focus.join('\n'))}</textarea></div>
    <div class="field"><label>建议问题（每行一题）</label><textarea class="textarea cfg-questions" data-index="${i}" rows="3">${esc(s.questions)}</textarea></div>
    <div class="gridwork" style="grid-template-columns:1fr 1fr"><div class="field"><label>分配的演示面试官（A/B，逗号分隔）</label><input class="input cfg-interviewers" data-index="${i}" value="${esc(s.interviewers.join(','))}"></div><div class="field"><label>独立面评数量</label><input class="input cfg-count" type="number" min="1" max="5" data-index="${i}" value="${s.scoreCount}"></div></div></div></details><div class="inlineactions" style="justify-content:flex-end;margin-top:5px"><button class="btn sm" data-role-action="stage-up" data-index="${i}" ${i===0?'disabled':''}>上移</button><button class="btn sm" data-role-action="stage-down" data-index="${i}" ${i===c.stages.length-1?'disabled':''}>下移</button><button class="btn sm negative" data-role-action="stage-remove" data-index="${i}" ${c.stages.length===1?'disabled':''}>删除阶段</button></div>`).join('')}
    <div class="inlineactions" style="margin-top:15px"><button class="btn blue" data-role-action="save-config-draft">保存配置草稿</button><button class="btn" data-role-action="publish-config">发布新版本</button></div>`;
  }else if(tab==='rubric'){
    body=`<h2>企业默认评价标准</h2><p class="muted tiny">岗位和面试阶段可以继承默认标准，也可以在授权范围内覆盖。</p><div class="field"><label>默认能力维度（每行一项）</label><textarea class="textarea" id="cfg-default-rubric" rows="6">${esc(c.defaultRubric.join('\n'))}</textarea></div><button class="btn blue" data-role-action="save-rubric-config">保存评价标准草稿</button>`;
  }else{
    body=`<h2>Agent 执行规则</h2><p class="muted tiny">配置 Agent 在企业授权范围内可以自动完成的工作，以及必须由人作出的决定。</p>
    ${[['resumeProcessing','新简历接入后自动解析、理解并准备初筛建议'],['interviewBrief','按面试阶段自动准备 Brief 和建议问题'],['parallelTranscriptScorecard','面试后并行处理转写与独立面评']].map(([k,label])=>`<label class="check"><input type="checkbox" data-agent-rule="${k}" ${c.agentRules[k]?'checked':''}> ${label}</label>`).join('')}
    <p class="muted tiny">Agent 负责准备与协助；初筛结论、Scorecard 提交和正式招聘决策均由人完成。这里不提供自动决策开关。</p><button class="btn blue" data-role-action="save-agent-config">保存 Agent 规则草稿</button>`;
  }
  return `<div class="headline"><div><div class="cap">RECRUITMENT CONFIGURATION · LOCAL DEMO</div><h1>招聘设置</h1><p class="sub">配置当前 Demo 所需的招聘流程、评价标准与 Agent 辅助范围；不建设企业级权限管理平台。</p></div><div class="headline-right">${chip(`已发布 v${c.publishedVersion} · 草稿 v${c.version}`,'blue')}<button class="btn" data-role-action="close-config">返回工作区</button></div></div>
  <div class="paper" style="padding:14px;margin-bottom:14px"><div class="inlineactions">${tabs.map(([id,label])=>`<button class="filterbtn ${tab===id?'active':''}" data-config-tab="${id}">${label}</button>`).join('')}<span class="muted tiny" style="margin-left:auto">模板 → 岗位 → 面试阶段</span></div></div>
  <section class="paper" style="padding:22px">${body}</section>
  <p class="muted tiny" style="margin-top:12px">配置变更生成新版本；已开始的招聘申请继续引用创建时固定的标准版本，除非负责人明确迁移。本页为本地演示配置，尚未连接 PostgreSQL。</p>`;
}
function workPage(){
  if(ui.configOpen)return configWorkspace();
  if(['A','B'].includes(ui.actor))return ui.aid?interviewerDetailPage():interviewerWorkPage();
  if(ui.actor==='HR')return recruiterWorkPage();
  let x=baseWorkPageV52();
  // The actionable items have one canonical home: the global "Human Attention" drawer.
  // Remove the duplicate right-column task list from the recruitment overview.
  x=x.replace(/<section class="paper asidecard"><div class="flex between"><h2>需要你处理<\/h2>[\s\S]*?(?=<section class="paper asidecard"><h2>其他正在招聘)/,'');
  return x;
}
function recordsPage(){
  if(['A','B'].includes(ui.actor))return interviewerRecordsPage();
  return baseRecordsPageV52();
}
function shell(){return legacy_shell();}

// Keep the demo role selector contextual. It changes the same workspace, not a second app.

function readStageDrafts(){
  const c=data.enterpriseConfig;
  document.querySelectorAll('.cfg-name').forEach(el=>{const s=c.stages[+el.dataset.index];if(s)s.name=el.value.trim()||s.name});
  document.querySelectorAll('.cfg-purpose').forEach(el=>{const s=c.stages[+el.dataset.index];if(s)s.purpose=el.value.trim()});
  document.querySelectorAll('.cfg-focus').forEach(el=>{const s=c.stages[+el.dataset.index];if(s)s.focus=el.value.split('\n').map(x=>x.trim()).filter(Boolean)});
  document.querySelectorAll('.cfg-questions').forEach(el=>{const s=c.stages[+el.dataset.index];if(s)s.questions=el.value});
  document.querySelectorAll('.cfg-interviewers').forEach(el=>{const s=c.stages[+el.dataset.index];if(s)s.interviewers=el.value.split(',').map(x=>x.trim()).filter(Boolean)});
  document.querySelectorAll('.cfg-count').forEach(el=>{const s=c.stages[+el.dataset.index];if(s)s.scoreCount=Math.max(1,Math.min(5,+el.value||1))});
}
function templateStages(kind){
  const product=[
    {id:'r1',roundNo:1,name:'第一轮 · 产品与基础能力',purpose:'判断岗位基础匹配、产品思维与问题拆解能力',focus:['产品理解与需求分析','用户研究与问题定义','Agent 基础认知'],questions:'请介绍一个你主导的问题定义过程。\n你如何判断一个 Agent 产品是否真正解决了用户问题？',duration:45,interviewers:['A'],scoreCount:1,gate:'完成本轮独立面评后由招聘方决定'},
    {id:'r2',roundNo:2,name:'第二轮 · 专业深度与落地',purpose:'深入考察方案设计、技术协作与落地能力',focus:['Agent 架构与工作流设计','数据与评测意识','跨职能交付'],questions:'请拆解一个你做过的 Agent 系统，说明关键取舍。\n如何设计评测来验证质量提升？',duration:60,interviewers:['B'],scoreCount:1,gate:'完成本轮所需独立面评后进入综合决策'},
    {id:'r3',roundNo:3,name:'终轮 · 综合判断',purpose:'评估业务判断、协作方式与岗位长期适配',focus:['业务判断与优先级','协作与影响力','岗位适配'],questions:'面对业务目标与技术约束冲突，你如何决策？',duration:45,interviewers:['A'],scoreCount:1,gate:'完成终轮面评后进入正式决策'}
  ];
  const general=[
    {id:'r1',roundNo:1,name:'第一轮 · 基础匹配',purpose:'了解经历、动机与基础岗位能力',focus:['岗位相关经验','沟通表达','基础专业能力'],questions:'请介绍与你申请岗位最相关的一段经历。',duration:40,interviewers:['A'],scoreCount:1,gate:'完成本轮面评后由招聘方决定'},
    {id:'r2',roundNo:2,name:'第二轮 · 综合评估',purpose:'深入评估实际能力与岗位适配',focus:['专业能力','问题解决','协作方式'],questions:'请介绍一个复杂问题及你的解决过程。',duration:50,interviewers:['B'],scoreCount:1,gate:'完成所需独立面评后进入正式决策'}
  ];
  const tech=clone(product);tech[0].name='第一轮 · 技术基础';tech[0].focus=['基础技术能力','工程实践','问题分析'];tech[1].name='第二轮 · 系统设计与工程落地';tech[1].focus=['系统设计','架构取舍','工程质量'];tech[2].name='终轮 · 协作与综合判断';tech[2].focus=['跨职能协作','复杂问题解决','岗位适配'];
  return clone(kind==='two'?general:kind==='tech'?tech:product);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-role-action],[data-role-open],[data-config-tab]');
  if(!b)return;
  if(b.dataset.roleOpen){
    ui.aid=b.dataset.roleOpen;ui.page='work';ui.drawer=null;ui.modal=null;ui.configOpen=false;render();$('scroll')?.scrollTo({top:0,behavior:'instant'});return;
  }
  if(b.dataset.configTab){ui.configTab=b.dataset.configTab;render();return;}
  const action=b.dataset.roleAction;
  if(action==='open-config'){ui.configOpen=true;ui.aid=null;ui.page='work';render();return;}
  if(action==='close-config'){ui.configOpen=false;render();return;}
  if(action==='open-score'){ui.modal={type:'score',actor:ui.actor};render();return;}
  if(action==='stage-up'||action==='stage-down'||action==='stage-remove'){
    const c=data.enterpriseConfig;readStageDrafts();const i=Number(b.dataset.index);
    if(action==='stage-remove'){
      if(c.stages.length<=1){notify('至少保留一个招聘阶段');return}
      c.stages.splice(i,1);
    }else{
      const j=action==='stage-up'?i-1:i+1;if(j<0||j>=c.stages.length)return;
      [c.stages[i],c.stages[j]]=[c.stages[j],c.stages[i]];
    }
    c.stages.forEach((st,index)=>st.roundNo=index+1);c.version++;save();render();notify('阶段结构已更新为配置草稿 v'+c.version+'；进行中的申请继续沿用原版本');return;
  }
  if(action==='template-two'||action==='template-product'||action==='template-tech'){
    const c=data.enterpriseConfig,kind=action==='template-two'?'two':action==='template-tech'?'tech':'product';
    c.stages=templateStages(kind);c.template=kind==='two'?'通用两轮':kind==='tech'?'技术三阶段':'产品三阶段';c.version++;save();ui.configTab='stages';notify('已载入可编辑模板草稿 v'+c.version+'；不会改变进行中的申请');render();return;
  }
  if(action==='add-stage'){
    const c=data.enterpriseConfig;c.stages.push({id:'stage-'+Date.now(),roundNo:c.stages.length+1,name:`第 ${c.stages.length+1} 轮 · 新阶段`,purpose:'定义本阶段的考察目标',focus:['新增考察维度'],questions:'',duration:45,interviewers:[],scoreCount:1,gate:'完成本轮独立面评后由招聘方决定'});ui.configTab='stages';render();return;
  }
  if(action==='save-config-draft'){
    const c=data.enterpriseConfig;readStageDrafts();
    c.version++;save();notify('招聘流程配置已保存为草稿 v'+c.version+'；现有申请保持原版本');return;
  }
  if(action==='publish-config'){
    const c=data.enterpriseConfig;readStageDrafts();c.version++;c.publishedVersion=c.version;c.publishedKey='R'+c.publishedVersion;c.template='企业自定义配置';data.configVersions=data.configVersions||{};data.configVersions[c.publishedKey]=clone(c);save();notify('新招聘框架版本 v'+c.publishedVersion+' 已发布；现有申请不自动迁移');render();return;
  }
  if(action==='save-rubric-config'){
    const c=data.enterpriseConfig;c.defaultRubric=($('#cfg-default-rubric')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);c.version++;save();notify('评价标准草稿已保存');return;
  }
  if(action==='save-agent-config'){
    const c=data.enterpriseConfig;document.querySelectorAll('[data-agent-rule]').forEach(el=>c.agentRules[el.dataset.agentRule]=el.checked);c.version++;save();notify('Agent 执行规则草稿已保存');return;
  }
});
render();for(const a of data.apps){if(a.state==='intake')later(()=>progressIntake(a.id),1150);else if(a.state==='screening'){a.state='intake';later(()=>progressIntake(a.id),1150)}else if(a.state==='review'&&a.transcript?.status==='processing'){later(()=>{const b=app(a.id);if(b?.state==='review'&&b.transcript.status==='processing'){b.transcript={status:'ready',text:'面试资料（合成演示）：双方讨论了候选人的业务项目、Agent 工作流与产品交付。',source:'SAMPLE'};log(`${person(b).name} 的面试资料已获取`,b.jid);render()}},1700)}}
</script></body></html>
