# @recruitment/dsh-recruitment bundle patch
#
# 一行插件（id + 包名），由 profile 作为 bundle 层叠加进 cordis 配置。
# 安装：dsh plugin --profile <profile> add link:<本目录绝对路径>
# 之后本包名会被自动写进该 profile package.json 的 dsh.profile.bundles。
#
# 宿主半部分（exports "."）在宿主进程里注册三个只读工具：
#   recruitment_resume_read / recruitment_candidate_get / recruitment_job_get
# 没有浏览器半部分（无 dsh.client 声明），不向 Web GUI 提供任何东西。
- insert:
    - id: recruitment
      name: '@recruitment/dsh-recruitment'
