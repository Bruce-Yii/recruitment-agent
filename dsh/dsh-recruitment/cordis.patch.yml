# Bundle layer for @recruitment/dsh-recruitment.
# Inserted into a profile's layer stack by the plugin loader.
#
# 两段配置，缺任何一段时对应工具仍会注册，但调用返回 NOT_CONFIGURED
# 并列出缺什么（不静默降级、不返回假数据）。
#
#   converter 三项 —— recruitment_resume_read / _serialize / _validate / _application_intake 要
#   database        —— recruitment_application_intake（写）/ _screening_evaluate（读）要
#
# database 段**没有 password 字段**：密码只从环境变量读（默认 RECRUITMENT_DB_PASSWORD，
# 可用 password_env 换成别的变量名）。tenant_id / actor_id 也不接受模型传入，
# 只能来自这里（tool-contracts.md §0 第 4 条、D-18）。
- insert:
    - id: recruitment
      name: '@recruitment/dsh-recruitment'
      config:
        converter:
          # D-112/G9：bundle 层同样零机器路径；由部署环境变量提供，缺值 fail-closed。
          python_bin: '${RECRUITMENT_PYTHON_BIN}'
          converter_dir: '${RECRUITMENT_CONVERTER_DIR}'
          allowed_roots:
            - '${RECRUITMENT_ALLOWED_ROOT_RESUME_POOL}'
            - '${RECRUITMENT_ALLOWED_ROOT_ORCHESTRATION}'
            - '${RECRUITMENT_ALLOWED_ROOT_CODEX}'
          timeout_ms: 60000
        database:
          host: 127.0.0.1
          port: 5432
          user: postgres
          database: ra_s6s7
          password_env: RECRUITMENT_DB_PASSWORD
          # 演示租户（0002_seed.sql §1）与 HR 专员 actor（§3，kind=HUMAN）。
          tenant_id: '11111111-1111-4111-8111-000000000001'
          actor_id: '11111111-1111-4111-8111-000000000103'
        # 邮箱收件（recruitment_email_fetch）+ 发信 Host Action（同一账号；发信不新增工具）。
        # 普通字符串不做 ${ENV} 插值（见下方 skill-filesystem 的注释）：这里写 ${...} 引用，
        # resolveMailConfig 自己展开；任一引用未定义/未展开即 NOT_CONFIGURED（fail-closed）。
        # 口令只从环境变量读，配置里只有 password_env 变量名，绝不落库/日志/payload。
        mail:
          host: '${RECRUITMENT_MAIL_HOST}'
          user: '${RECRUITMENT_MAIL_USER}'
          password_env: RECRUITMENT_MAIL_PASSWORD
          port: 993
          tls: true
          folder: INBOX
          # 首次扫描只回看 7 天窗口，禁止全量扫历史；可由 since_uid 水位覆盖。
          since_days: 7
          # since_uid: 0  # 可选 UID 水位（不配则用 since_days）
          # 发信（Host Action /recruitment/api/action/email/send，不新增工具）。
          # smtp_host 缺省 = host（同一账号），无需再配一个环境变量。
          # smtp_tls 语义：true = 隐式 TLS（465 常用）；false = STARTTLS（587 常用）。
          # QQ 的 587 走 STARTTLS，故这里 false；与 IMAP 的 tls:true（993 隐式）不同，不要混。
          smtp_port: 587
          smtp_tls: false

# ---------------------------------------------------------------------------
# 把本包自带的 DSH skill 接进技能目录扫描根（复用 @deepseek-ai/dsh-skill-filesystem，
# 不自研 orchestrator、不另造 Agent Loop）。
#
# 为什么不放仓库根 `.dsh/skills`：那里是工作区本地状态（`.dsh/` 不入库），而这份
# skill 是产品交付物，必须跟着插件包走、随 profile 的 bundle 列表生效。
#
# 语义：非 insert 的 patch 按 `id` 命中已有行，**整体替换**该行的 `config`
# （`dsh-app-boot` 的 applyEntryPatches）。skill-filesystem 默认 config 为空，
# 这里只加 `customSkillDirs`；`includeDefaultRoots` / `watch` 仍走默认值。
- id: skill-filesystem
  config:
    customSkillDirs:
      # D-112/G9：DSH profile patch 支持 `!!js` 表达式；普通字符串不做 `${ENV}` 插值。
      - !!js process.env.RECRUITMENT_SKILL_DIR
