- insert:
    - id: recruitment
      name: '@recruitment/dsh-recruitment'
      config:
        converter:
          # D-112/G9：仓库受管 profile **零机器路径**；值由部署环境提供，缺变量即
          # fail-closed（`src/tools/converter.ts::resolveConverterConfig(config, env)` 逐条列 issue）。
          # 变量名见 dsh/profile/recruitment/README.md 与 work/verify-2026-11-15-g7g9/wiring/env.example.ps1。
          python_bin: '${RECRUITMENT_PYTHON_BIN}'
          converter_dir: '${RECRUITMENT_CONVERTER_DIR}'
          # 三个可读根各自一个变量：不做分隔符拆分（不猜格式、未定义即 fail-closed）。
          allowed_roots:
            - '${RECRUITMENT_ALLOWED_ROOT_RESUME_POOL}'
            - '${RECRUITMENT_ALLOWED_ROOT_ORCHESTRATION}'
            - '${RECRUITMENT_ALLOWED_ROOT_CODEX}'
          timeout_ms: 180000
        # G7：飞书 Minutes 只读连接器（真实读取）。cli 必须是绝对路径（禁止 PATH 回退）；
        # profile 必须显式给出，绝不隐式落到 lark-cli 的开发者全局默认档案。
        feishu:
          cli: '${RECRUITMENT_FEISHU_CLI}'
          profile: 'recruitment'
          timeout_ms: 180000
          max_attempts: 1
        database:
          host: 127.0.0.1
          port: 5432
          user: postgres
          database: ra_s6s7
          password_env: RECRUITMENT_DB_PASSWORD
          # 演示租户（0002_seed.sql §1）与 HR 专员 actor（§3，kind=HUMAN）。
          tenant_id: '11111111-1111-4111-8111-000000000001'
          actor_id: '11111111-1111-4111-8111-000000000103'
        # 任务运行时（Event → Business Task → Attempt → DSH Worker Session）。
        #
        # **必须写进产品 profile**：插件只在 `if (config?.runtime?.enabled === true)` 时装配
        # `/recruitment/runtime/*` 路由与 engine Effects 派发者（`engineEffects.start()`）。
        # 少了这一段，两者在产品入口永远不可达（E4 BLOCKED，2026-11-14 E1–E4 审计 B-1/B-2）。
        #
        # 必填键以 `src/runtime/config.ts::resolveRuntimeConfig` 为准：enabled +
        # worker_profile + runtime_version + model_route + dsh_bin（或用既有 `$DSH_INSTALL_DIR` 回退）。
        # 其余键走默认（permission_mode=workspace-write、timeout_ms=180000、lease_ms=900000 > timeout）。
        #
        # **本文件是可移植的受管定义，禁止出现机器路径**（2026-11-14 合规要求）：
        # - `dsh_bin` 故意不写：`resolveRuntimeConfig` 的既有契约是缺省从 `$DSH_INSTALL_DIR`
        #   派生 `<install>/lib/bin.js`；缺该环境变量即 fail closed 并逐条列 issue（不静默降级）。
        #   启动产品前设置 `$env:DSH_INSTALL_DIR = '<项目自带 DSH 包根>'`，见本目录 README。
        # - `worker_profile` 指向仓库受管的 `dsh/profile/recruitment-worker`（同步到
        #   `$DSH_HOME/profiles/recruitment-worker/`），不绑定某台机器上的探针 profile。
        runtime:
          enabled: true
          worker_profile: recruitment-worker
          runtime_version: '0.2.2-rc.3'
          model_route: 'opencode-go-openai/deepseek-v4.1-flash'
          # D5/复核：worker 工作目录禁止回退到进程 cwd（旧仓库）；由部署环境显式钉住。
          workspace_root: ${RECRUITMENT_WORKSPACE_ROOT}
          # G1（事件自动驱动）：插件进程内用专用连接持有 PG 咨询锁
          # hashtext('recruitment:tick')，周期 router.tick()；多实例只有一个派发者。
          # **发布闸门（2026-11-15 独立复核 P1）**：G2（Worker 能执行业务工具 + 就绪检查）
          # 落地前必须为 false——否则每收一份简历就自动拉起跑不了业务的 Worker，
          # attempts 耗尽后任务 FAILED、简历解析永不完成。G2 验收同批才翻回 true。
          auto_tick: true
          tick_interval_ms: 2000
        # task-78：Agent 业务成本预算（硬闸门 = DSH tools.guard()；超限零写 + 交接文本）。
        # 单一来源：本段是唯一受管定义；env 只作部署注入覆盖（RECRUITMENT_BUDGET_<KEY>），
        # 解析结果逐键带 sources（profile|env|default）；非法值 fail-closed 回退默认并列 issue。
        # status_tool 默认 false：显式开启会让权威工具数 30→31（D-128.2），只在验证 profile 开。
        # 缺省键自动回退内置默认（src/budget/config.ts DEFAULT_LIMITS），本段显式写出便于审计。
        budget:
          enabled: true   # lead 裁决：产品 profile 显式开；worker profile 显式 false（见 profile-worker-budget.patch）
          DECISION_MAX_TOKENS: 200000
          DECISION_MAX_STEPS: 25
          SCREENING_MAX_TOKENS: 100000
          SCREENING_MAX_STEPS: 15
          task_class: AUTO
          default_class: SCREENING
          status_tool: false
          # tool_class_map: {}   # 覆盖默认工具→类映射（可选）
          # handoff:
          #   owner: '招聘负责人 / approver（正式决策与审批）'

# ---------------------------------------------------------------------------
# 把本包自带的 DSH skill 接进技能目录扫描根（复用 @deepseek-ai/dsh-skill-filesystem）。
#
# 为什么不放仓库根 `.dsh/skills`：那里是工作区本地状态（`.dsh/` 不入库），而这份
# skill 是产品交付物，必须跟着插件包走、随 profile 的 bundle 列表生效。
- id: skill-filesystem
  config:
    customSkillDirs:
      # D-112/G9：目录由部署环境给出。DSH 的 profile patch 支持 `!!js` 表达式
      # （`cordis-plugin-loader` 的 interpolate 只求值 `!!js`，普通字符串不展开 env），
      # 所以这里用 DSH 原生能力，不 fork、不改基础包；缺变量时加载期 fail-closed。
      - !!js process.env.RECRUITMENT_SKILL_DIR
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# ---------------------------------------------------------------------------
# task-75（产品/业务 FAIL 修复 1）：Agent 工程工具面收口（W0 应用，2026-11-16）。
# 依据：work/d5/product-read/TOOL-SURFACE.md §2；14-PRODUCT-BUSINESS-VERDICT §2.2/§4.2。
# 事实：真实 HR 会话里 Agent 为读申请/材料去 shell、psql 直连业务库、读源码、全盘找文件。
#     这是权限/合规红线，不是"模型行为偏好"——靠 prompt 约束不算修好，必须让工具**不存在**。
# 说明：
#   * 这些 row 定义在 @deepseek-ai/dsh-base / @deepseek-ai/dsh-web-app 的 bundle patch 里，
#     本 profile patch 是最后一层，按 id 覆盖（只加 disabled，不重述 config）。
#   * 收口后招聘 Agent 只能通过 recruitment_* 工具读写业务事实。
#   * 人类闸门（approval / user-questions）、任务跟踪（todo/goal）、产品 skill 保留。
#   * 业务读能力由 task-75 的 recruitment_application_get / recruitment_material_read 补齐。
# ---------------------------------------------------------------------------
- id: tool-pwsh
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-agent-team
  disabled: true
- id: tool-workflow
  disabled: true
- id: agent-instructions
  disabled: true
# web-app bundle 层（产品 profile 也加载 @deepseek-ai/dsh-web-app）
- id: office-kit
  disabled: true
- id: workspace-dependencies
  disabled: true
- id: cordis-host-runner
  disabled: true
- id: cordis-inspect-providers
  disabled: true
- id: mcp-manager
  disabled: true
- id: mcp-resources
  disabled: true
# task-75 收口漏项（2026-11-16 产品视角复核 O5 实测发现）：`dsh-tool-subagent-control` 注册的是
# `list_agents` / `send_message` / `wait_agent` —— 这是**编排面**，产品会话里 HR 不该看到，
# 而且它会诱导模型去"找别的 agent 帮忙"而不是回答 HR。上一版只关了 `tool-subagent` /
# `tool-subagent-fork` / `tool-agent-team`，漏了这一行（A2 会话 request/header 里三者确实可达）。
- id: tool-subagent-control
  disabled: true

# task-75 收口补二（2026-11-16 产品视角复核 O10 实测）：产品会话的 system/message 原文是
#   "You are an AI agent powered by DeepSeek Harness. You are a coding agent powered by the beam-free model."
# 产品是**招聘助手**，不是 coding agent —— 实测里它因此去试 `bash`（虽然工具已被关掉，幻觉仍白烧一步）。
# 关掉 harness 固定身份句，改用招聘角色人设；人设里显式写"只用 recruitment_* 工具、不索要材料、不暴露内部标识"。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: |-
      You are a recruitment operations assistant working inside an HR product for HR staff and interviewers.
      Your job: read candidates' materials and job criteria, give evidence-based screening suggestions, help record
      decisions a human has already made, and keep interview/evaluation facts consistent.
      Rules:
      - Use only the recruitment_* tools to read or write business facts. Never use shell, database clients, source code, or file tools.
      - What the candidate submitted is the complete basis of evidence. Never ask the user for more documents and never call submitted materials incomplete.
      - Never show internal identifiers, hashes, machine reason codes, API routes, or implementation details to the user. Speak as a recruiter would.
      - When a human decision is needed, ask for the decision; do not guess it. When the information on hand is insufficient to judge, say what is missing from the evidence (not from the submission).
      - Never ask the user to fill in, supplement, or re-enter data the system failed to extract (for example a name the parser could not read). State it as a fact ("the name could not be read from the resume") and continue with what you have.
      - When a tool returns remediation, next tools, or a recommended next step, follow that guidance literally. Never propose an action that no available tool supports (for example re-binding an application to a different rubric version), and never explain internal version conflicts (such as "switching back to an older rubric") as something the user must resolve.
      - Keep answers short and actionable: what you concluded, the evidence you relied on, and what the human should do next.

# ---------------------------------------------------------------------------
# O19（2026-11-16 产品视角复核，**安全红线**）：Web 聊天（HR 真正的入口）实测有 61 个工具，
# 含 `pwsh` / `read` / `write` / `edit` / `glob` / `grep` / `web_search` / `web_fetch` /
# `plugin_manager` / `subagent` / `workflow` / `list_agents` / `send_message` / `wait_agent`。
# 根因（总控从 composed config 实证）：Web 会话跑的是 DSH 自带的 **agent preset `standard`**，
# 它自带一棵 plugin 子树（persona / agent-instructions / tool-bash / tool-pwsh / tool-fs /
# tool-fs-search / tool-jobs / tool-schedule / delegation / tool-web / tool-office /
# tool-plugin-manager …）。本文件顶部那些 `disabled: true` 只作用于**顶层 profile 树**，
# 对 preset 子树无效 —— 所以"工具面收口"在 headless 生效、在真实 Web 聊天不生效。
# 同一根因还解释了 O10：preset 自带 persona 是
#   "You are a coding agent powered by the {{model}} model."
# （顶层 system-prompt 的人设被 preset 的 persona 遮蔽）。
#
# 修法（复用 DSH 原生能力，不自研）：用 patch 的 `insert` 语法新增**产品自有 preset**，
# 只挂招聘需要的插件（人设 / 时间上下文 / skill / goal / todo / 提问 / 压缩）；
# 把 preset-registry 的 default 指向它；并禁用 DSH 自带的 standard/ptc/cordis/minimal，
# 让 HR 无法切回全工具 preset。这样 Web 会话的工具面 = 全局注册的 30 个招聘工具
# + skill/goal/todo/ask（≈35），工程工具**不在注册表里**（不是靠 prompt 忍）。
# ---------------------------------------------------------------------------
- id: agent-preset-registry
  config:
    default: recruitment
- insert:
    - id: preset-recruitment
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: recruitment
        name: 招聘助手
        description: 招聘业务专用：只有招聘工具（读写业务事实）+ 提问/计划/技能；无 shell、文件、插件管理、子代理、工作流。
        order: 1
        plugins:
          # 人设：招聘助手（不是 coding agent）。DSH 的 preset persona 会遮蔽顶层 system-prompt，
          # 所以产品人设必须写在 preset 里（顶层那份作为兜底保留，两者措辞一致）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a recruitment operations assistant working inside an HR product for HR staff and interviewers.
                Your job: read candidates' materials and job criteria, give evidence-based screening suggestions, help record
                decisions a human has already made, and keep interview/evaluation facts consistent.
                Rules:
                - Use only the recruitment_* tools to read or write business facts. Never use shell, database clients, source code, or file tools.
                - What the candidate submitted is the complete basis of evidence. Never ask the user for more documents and never call submitted materials incomplete.
                - Never show internal identifiers, hashes, machine reason codes, API routes, or implementation details to the user. Speak as a recruiter would.
                - When a human decision is needed, ask for the decision; do not guess it. When the information on hand is insufficient to judge, say what is missing from the evidence (not from the submission).
                - Never ask the user to fill in, supplement, or re-enter data the system failed to extract (for example a name the parser could not read). State it as a fact ("the name could not be read from the resume") and continue with what you have.
                - When a tool returns remediation, next tools, or a recommended next step, follow that guidance literally. Never propose an action that no available tool supports (for example re-binding an application to a different rubric version), and never explain internal version conflicts (such as "switching back to an older rubric") as something the user must resolve.
                - Keep answers short and actionable: what you concluded, the evidence you relied on, and what the human should do next.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 产品 skill（S6→S7 等操作手册）：目录由部署环境给出，缺变量加载期 fail-closed。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.env.RECRUITMENT_SKILL_DIR
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 会话内的计划能力（不是业务事实）：goal / todo。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 人类交互（问人 / 等人回答）：产品需要，保留。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 长会话上下文压缩：保留（去掉会让长对话直接爆窗）。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
# 禁用 DSH 自带的全工具 preset：HR 不能切回 standard/ptc/cordis/minimal。
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-minimal
  disabled: true
