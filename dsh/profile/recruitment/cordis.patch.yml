# 产品 profile（v1.0）：DSH Web + 招聘插件。底座 @deepseek-ai/dsh@0.2.2-rc.1（项目自带副本，D-92）。
# 模型段沿用 opencode-go（beam-free）—— 0.2.2 原生 deepseek 账号路由额度已用尽，QUOTA。

# 产品 profile（v1.0）：DSH Web + 招聘插件。
#
# 与 desktop profile 的关系：模型/provider 段是从 desktop 抄来的（同一台机器、同一套凭据），
# 但这里不包含任何 desktop 专有的 UI / agent-team / market 插件。
#
# 注意：这里**不写数据库密码**（R7：secret 不进文件）。密码由环境变量
# RECRUITMENT_DB_PASSWORD 提供；缺了就 fail closed（工具报 NOT_CONFIGURED）。

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go-openai-key2
    model: longcat-2.5-free
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai-codex:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 272000
            maxTokens: 128000
            reasoningEfforts:
              off: null
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-5.3-codex-spark
            name: GPT-5.3 Codex Spark
            contextWindow: 128000
            maxTokens: 128000
          - id: gpt-5.5
            name: GPT-5.5
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-5.6-terra
            name: GPT-5.6 Terra
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-6-sol
            name: GPT-6 Sol
            contextWindow: 272000
            maxTokens: 128000
      opencode-go:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        apiKeyEnv: OPENCODE_GO_API_KEY
        models:
          - id: deepseek-v4.1-flash
          - id: glm-5.3
          - id: glm-5.3-flash
          - id: muse-spark-1.2-contributor
          - id: muse-spark-1.3-contributor
      opencode-go-openai:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        displayName: OpenCode Go · OpenAI 兼容
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: dsh-opencode-go-openai
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5.3-flash
            name: GLM-5.3 Flash
            contextWindow: 1048576
            maxTokens: 131072
          - id: beam-free
            name: "[免费] Beam Free"
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: iceman-contributor-free
            name: "[免费] Iceman Contributor Free"
            contextWindow: 262144
            maxTokens: 131072
          - id: longcat-2.5-free
            name: "[免费] LongCat 2.5 Free"
            contextWindow: 1000000
            maxTokens: 262144
            input:
              - text
              - image
      opencode-go-openai-key2:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        displayName: OpenCode Go · OpenAI 兼容 (新密钥)
        apiKeyEnv: OPENCODE_GO_API_KEY_2
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: dsh-opencode-go-openai-key2
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5.3-flash
            name: GLM-5.3 Flash
            contextWindow: 1048576
            maxTokens: 131072
          - id: beam-free
            name: "[免费] Beam Free"
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: iceman-contributor-free
            name: "[免费] Iceman Contributor Free"
            contextWindow: 262144
            maxTokens: 131072
          - id: longcat-2.5-free
            name: "[免费] LongCat 2.5 Free"
            contextWindow: 1000000
            maxTokens: 262144
            input:
              - text
              - image


- insert:
    - id: recruitment
      name: '@recruitment/dsh-recruitment'
      config:
        converter:
          python_bin: 'D:\Python3.12.9\python.exe'
          converter_dir: 'D:\12412\dsh工作区\projects\recruitment-agent\converter'
          allowed_roots:
            - 'D:\12412\dsh工作区\projects\resume-talent-pool'
            - 'D:\12412\dsh工作区\orchestration'
            - 'D:\12412\CodexWorkspace'
          timeout_ms: 180000
        database:
          host: 127.0.0.1
          port: 5432
          user: postgres
          database: ra_s6s7
          password_env: RECRUITMENT_DB_PASSWORD
          # 演示租户（0002_seed.sql §1）与 HR 专员 actor（§3，kind=HUMAN）。
          tenant_id: '11111111-1111-4111-8111-000000000001'
          actor_id: '11111111-1111-4111-8111-000000000103'
        # 任务运行时（Event → Business Task → Attempt → DSH Worker Session）。
        #
        # **必须写进产品 profile**：插件只在 `if (config?.runtime?.enabled === true)` 时装配
        # `/recruitment/runtime/*` 路由与 engine Effects 派发者（`engineEffects.start()`）。
        # 少了这一段，两者在产品入口永远不可达（E4 BLOCKED，2026-11-14 E1–E4 审计 B-1/B-2）。
        #
        # 必填键以 `src/runtime/config.ts::resolveRuntimeConfig` 为准：enabled +
        # worker_profile + runtime_version + model_route + dsh_bin（或用既有 `$DSH_INSTALL_DIR` 回退）。
        # 其余键走默认（permission_mode=workspace-write、timeout_ms=180000、lease_ms=900000 > timeout）。
        #
        # **本文件是可移植的受管定义，禁止出现机器路径**（2026-11-14 合规要求）：
        # - `dsh_bin` 故意不写：`resolveRuntimeConfig` 的既有契约是缺省从 `$DSH_INSTALL_DIR`
        #   派生 `<install>/lib/bin.js`；缺该环境变量即 fail closed 并逐条列 issue（不静默降级）。
        #   启动产品前设置 `$env:DSH_INSTALL_DIR = '<项目自带 DSH 包根>'`，见本目录 README。
        # - `worker_profile` 指向仓库受管的 `dsh/profile/recruitment-worker`（同步到
        #   `$DSH_HOME/profiles/recruitment-worker/`），不绑定某台机器上的探针 profile。
        runtime:
          enabled: true
          worker_profile: recruitment-worker
          runtime_version: '0.2.2-rc.3'
          model_route: 'opencode-go-openai-key2/longcat-2.5-free'

# ---------------------------------------------------------------------------
# 把本包自带的 DSH skill 接进技能目录扫描根（复用 @deepseek-ai/dsh-skill-filesystem）。
#
# 为什么不放仓库根 `.dsh/skills`：那里是工作区本地状态（`.dsh/` 不入库），而这份
# skill 是产品交付物，必须跟着插件包走、随 profile 的 bundle 列表生效。
- id: skill-filesystem
  config:
    customSkillDirs:
      - 'D:\12412\dsh工作区\projects\recruitment-agent\dsh\dsh-recruitment\skill'
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
