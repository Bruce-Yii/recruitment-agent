# 产品 worker profile（受管定义）：任务运行时的 DSH Worker Session 用这个 profile。
#
# 为什么 headless：Router 用 `dsh --profile <worker> --json` 起独立子进程执行一次 Attempt，
# 不需要 Web UI；`@deepseek-ai/dsh-headless` 是官方的一次性 agent bundle 组合。
# 为什么重新启用 credentials：headless 默认关闭 managed credential store，worker 子进程
# 环境里没有 provider API key，密钥只能从 `$DSH_HOME/.credentials.yaml` 取。
#
# 本文件**不含任何机器路径/密钥**：模型走 apiKeyEnv 名，路径/凭据来自环境。
# 模型段与产品 profile `dsh/profile/recruitment` 保持一致（longcat-2.5-free，D-93 实测可用）。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go-openai
    model: hy4-flash-free
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai-codex:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 272000
            maxTokens: 128000
            reasoningEfforts:
              off: null
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-5.3-codex-spark
            name: GPT-5.3 Codex Spark
            contextWindow: 128000
            maxTokens: 128000
          - id: gpt-5.5
            name: GPT-5.5
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-5.6-terra
            name: GPT-5.6 Terra
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 272000
            maxTokens: 128000
          - id: gpt-6-sol
            name: GPT-6 Sol
            contextWindow: 272000
            maxTokens: 128000
      opencode-go:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        apiKeyEnv: OPENCODE_GO_API_KEY
        models:
          - id: deepseek-v4.1-flash
          - id: glm-5.3
          - id: glm-5.3-flash
          - id: muse-spark-1.2-contributor
          - id: muse-spark-1.3-contributor
      opencode-go-openai:
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 3000
            maxDelayMs: 60000
            jitterRatio: 0.2
        displayName: OpenCode Go · OpenAI 兼容
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: dsh-opencode-go-openai
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5.3-flash
            name: GLM-5.3 Flash
            contextWindow: 1048576
            maxTokens: 131072
          - id: beam-free
            name: "[免费] Beam Free"
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: iceman-contributor-free
            name: "[免费] Iceman Contributor Free"
            contextWindow: 262144
            maxTokens: 131072
          - id: longcat-2.5-free
            name: "[免费] LongCat 2.5 Free"
            contextWindow: 1000000
