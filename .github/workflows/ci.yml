name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Always runs. Proves the source compiles and that the committed corpus
  # manifests stay portable (no machine-absolute paths).
  compile:
    name: converter (compile + manifest portability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r converter/requirements.txt

      - name: Compile converter/src
        run: python -m compileall -q converter/src

      - name: Corpus manifests must be portable
        run: |
          set -euo pipefail
          if grep -rn --include='*.jsonl' -e 'D:\\' -e 'C:\\' converter/corpus; then
            echo "::error title=Machine path in manifest::Corpus manifests must use root+rel, never a machine-absolute path."
            exit 1
          fi
          echo "corpus manifests contain no machine-absolute paths"

      - name: Report acceptance-test availability
        run: |
          if [ "${{ vars.CORPUS_AVAILABLE }}" = "true" ]; then
            echo "corpus acceptance job will run"
          else
            echo "::notice title=Corpus acceptance NOT RUN::converter/tests needs the corpus originals (not in the repo, by design). Set repository variable CORPUS_AVAILABLE=true and provide the originals to run it. A green compile job is NOT acceptance evidence — see converter/reports/acceptance.md for the recorded run."
          fi

  # Runs only when the corpus originals are available on the runner.
  # It is intentionally not part of the default green path: a suite that cannot
  # run must never be reported as passing.
  corpus-acceptance:
    name: converter (acceptance tests, needs corpus)
    if: ${{ vars.CORPUS_AVAILABLE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r converter/requirements.txt

      - name: Run acceptance tests
        env:
          CORPUS_ROOT_TALENT_POOL: ${{ vars.CORPUS_ROOT_TALENT_POOL }}
          CORPUS_ROOT_ODOO_SAMPLES: ${{ vars.CORPUS_ROOT_ODOO_SAMPLES }}
          CORPUS_ROOT_CODEX_CONVERTED: ${{ vars.CORPUS_ROOT_CODEX_CONVERTED }}
          CORPUS_ROOT_SYNTHETIC: ${{ vars.CORPUS_ROOT_SYNTHETIC }}
        run: |
          set -euo pipefail
          python -m pytest converter/tests -q
