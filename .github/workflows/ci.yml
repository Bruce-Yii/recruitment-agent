name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：feature 分支不满足 push/pull_request 条件时，CI 永远跑不到，
  # 于是"本机绿"成了唯一证据（R8 独立验证缺失）。加 workflow_dispatch 后可以
  # `gh workflow run CI --ref <branch>` 在**不开 PR**的前提下跑真实 CI。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Always runs. Proves the source compiles and that the committed corpus
  # manifests stay portable (no machine-absolute paths).
  compile:
    name: converter (compile + manifest portability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r converter/requirements.txt

      - name: Compile converter/src
        run: python -m compileall -q converter/src

      - name: Corpus manifests must be portable
        run: |
          set -euo pipefail
          # 旧守卫只扫 `*.jsonl`，而实际泄露绝对路径的是 `*.json`（batch2-picked.json 里
          # 十几条 `D:\12412\...`）。覆盖窄的守卫比没有守卫更危险：它会给出"检查过了"的错觉。
          if grep -rn --include='*.jsonl' --include='*.json' -e 'D:\\' -e 'C:\\' converter/corpus; then
            echo "::error title=Machine path in manifest::Corpus manifests must use root+rel, never a machine-absolute path."
            exit 1
          fi
          echo "corpus manifests contain no machine-absolute paths"

      - name: Converter tests (corpus-independent; 四数 + 声明式 skip)
        # E2：converter 这一侧原来只有"compileall 通过"和一条"acceptance 没跑"的 notice，
        # **一个数都没有**。而 `--no-corpus` 能把"不依赖语料原件"的那部分真跑起来（本机实测
        # 94 passed / 27 skipped / 4.95s，不需要数据库也不需要语料），所以没理由不跑。
        # 27 条 skip 必须逐条对上声明理由，否则 exit 1 —— 声明式 skip，不是"有跳过就算了"。
        run: |
          set -uo pipefail
          STATUS=0
          python -m pytest converter/tests -q -rs --no-corpus 2>&1 | tee /tmp/converter-tests.log || STATUS=$?

          echo "== 四数（R3/E2：tests / pass / fail / skipped 必须都报）"
          tail -1 /tmp/converter-tests.log

          UNDECLARED=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              # 唯一允许的 skip 来源：--no-corpus（D-56）把依赖语料原件的用例逐条跳过
              *'--no-corpus：依赖语料原件的用例未运行'*) ;;
              *) echo "::error title=Undeclared skip::不在声明清单里的 skip：$line"; UNDECLARED=$((UNDECLARED + 1)) ;;
            esac
          done < <(grep '^SKIPPED' /tmp/converter-tests.log || true)
          if [ "$UNDECLARED" -gt 0 ]; then
            echo "::error title=Undeclared skip::有 $UNDECLARED 条 skip 不在声明清单里（skip 不等于通过）"
            exit 1
          fi

          exit "$STATUS"

      - name: Report acceptance-test availability
        run: |
          if [ "${{ vars.CORPUS_AVAILABLE }}" = "true" ]; then
            echo "corpus acceptance job will run"
          else
            echo "::notice title=Corpus acceptance NOT RUN::converter/tests needs the corpus originals (not in the repo, by design). Set repository variable CORPUS_AVAILABLE=true and provide the originals to run it. A green compile job is NOT acceptance evidence — see converter/reports/acceptance.md for the recorded run."
          fi

  # Runs only when the corpus originals are available on the runner.
  # It is intentionally not part of the default green path: a suite that cannot
  # run must never be reported as passing.
  corpus-acceptance:
    name: converter (acceptance tests, needs corpus)
    if: ${{ vars.CORPUS_AVAILABLE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r converter/requirements.txt

      - name: Run acceptance tests
        env:
          CORPUS_ROOT_TALENT_POOL: ${{ vars.CORPUS_ROOT_TALENT_POOL }}
          CORPUS_ROOT_ODOO_SAMPLES: ${{ vars.CORPUS_ROOT_ODOO_SAMPLES }}
          CORPUS_ROOT_CODEX_CONVERTED: ${{ vars.CORPUS_ROOT_CODEX_CONVERTED }}
          CORPUS_ROOT_SYNTHETIC: ${{ vars.CORPUS_ROOT_SYNTHETIC }}
        run: |
          set -euo pipefail
          python -m pytest converter/tests -q

  # 插件自己的测试。历史教训：68 条单测全绿，而 5 个工具从来没有被 DSH 运行时调用过，
  # 第一次真实调用就 INVALID_TOOL_OUTPUT。所以这里只保证"包内不坏"，
  # 真正的可达性证据在 dsh/dsh-recruitment/evidence/ 里（需要真实模型，不进 CI）。
  #
  # 集成测试需要真库（`ra_s6s7`）：所以这里起一个 postgres service、跑完 0001→0007 迁移再跑测试。
  # 不能靠"没库就 skip"——那正是历史上 105/170 静默 skip 而 exit 0 的复发路径（R3）。
  plugin:
    name: dsh plugin (node --test + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ra_s6s7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ra_s6s7
      RECRUITMENT_DB_PASSWORD: postgres
      RECRUITMENT_TEST_DB: ra_s6s7
    steps:
      - uses: actions/checkout@v4

      - name: Checkout must be pristine (不许依赖未入库文件)
        # 历史教训：三次"HEAD 不自洽"都是同一形态——某个已入库文件 import 了**还没入库**的模块
        # （event-types.ts / media.ts 的 MEDIA_RTF / integration/db.ts 的 assertPrivateDatabase），
        # 本机因为工作树里恰好有那个文件所以绿，干净检出直接 ERR_MODULE_NOT_FOUND。
        # 这条门本身不能修那种缺陷，但它保证"下面那条干净加载门"测的确实是干净树。
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Checkout not pristine::检出不是干净的，干净加载门将失去意义"
            git status --porcelain
            exit 1
          fi
          echo "checkout is pristine"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Apply migrations for the plugin integration tests
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do f=$(basename "$f" .sql);
            psql -v ON_ERROR_STOP=1 -q -f "db/migrations/$f.sql"
          done

      - name: Install plugin dependencies
        working-directory: dsh/dsh-recruitment
        run: pnpm install --frozen-lockfile

      - name: Clean-load gate (干净检出必须能 import 插件入口)
        # 为什么要单独设一道门：跑测试要几分钟才暴露"缺模块"，而 import 一秒就能暴露。
        # `src/index.ts` 是唯一的装配入口（25 个工具、runtime、http 全从它挂上去），
        # import 它等于把整张依赖图走一遍——任何"引用了没入库的模块"都会在这里当场炸。
        # 不许用 `--check` 之类只看语法的方式代替：语法对、模块缺，正是历史缺陷的形态。
        # 逻辑落在 scripts/clean-load.mjs 而不是内联 `node -e`：多行 JS 在 bash 与
        # PowerShell 里引号规则不一致，本机验不了的守卫等于没有守卫。
        run: node scripts/clean-load.mjs

      - name: D-109 调度预算机检
        # D-109 §3 的预算条款原本没有度量口径、也没有机检 —— 一个无法失败的预算不是预算。
        # 口径与棘轮规则见 docs/17 的 D-109.1 修订与 scripts/runtime-budget.mjs 的文件头。
        run: node scripts/runtime-budget.mjs

      # 插件测试会调真实 converter（Python）并生成合成 fixture，需要
      # PyMuPDF + python-docx + Pillow。缺了不是 skip 而是**失败**（fixtures.ts 明确
      # 要求"找不到就 fail，不许静默跳过"），所以 CI 必须装。首次真跑就是死在这里。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps for plugin tests
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r converter/requirements.txt

      - name: Run plugin tests
        working-directory: dsh/dsh-recruitment
        # R3：必须报 passed / failed / skipped 三个数，`skipped > 0` 不得宣称全绿。
        # `node --test` 在 skip 时 exit 0，所以只靠退出码会把"静默跳过"当成通过——
        # 这正是历史上 105/170 静默 skip 而 exit 0 的复发路径。
        #
        # 跑 `test/run-all.mjs` 而不是裸 `node --test`：裸发现规则会把 `test/**` 下的
        # **非测试文件**也当测试执行（`test/runtime/db.ts` 是 helper、
        # `test/fixtures/feishu/fake-lark-cli.mjs` 是假 CLI），结果是"CI 红，但红的不是被测代码"。
        # 单一权威：测试集合只在 run-all.mjs 里定义一次，本机 `pnpm test` 与 CI 跑同一套。
        run: |
          set -uo pipefail
          # 注意不用 `set -e`：要保证**失败时也把四数打出来**（历史教训：`node --test | tee`
          # 配 `set -e` 会在第一次非零退出时直接掐断，四数一条都没打印，于是"红得没有信息"）。
          STATUS=0
          # **为什么 CI 跑串行**：`node --test` 默认按文件并行。插件测试里有少量用例
          # **故意提交**数据到共享库（并发用例必须提交，否则第二个连接看不见未提交行），
          # 并行跑时它们与其它文件的提交/清理互相干扰，表现为偶发 `VERSION_CONFLICT`
          # （2026-11-14 实测：同一 SHA 连跑两次，一次 plugin job 红在
          # `A6 并发（两连接）`、一次全绿）。CI 门的价值是"绿就是绿"，偶发红会直接
          # 废掉这个信号。串行不会降低覆盖——test-isolation 已实测"并行=串行、失败集合逐条一致"；
          # 并行仍保留为本地默认（`pnpm test`），用来开发时快跑。
          node test/run-all.mjs --test-concurrency=1 2>&1 | tee /tmp/plugin-tests.log || STATUS=$?

          echo "== 四数（R3/E2：tests / pass / fail / skipped 必须都报）"
          grep -E '^ℹ (tests|pass|fail|skipped) ' /tmp/plugin-tests.log || true

          # E2：skip 必须**显式声明**，而且声明必须是逐条对上的，不是"我说有一条可跳"。
          # 出现清单外的 skip 一律失败；清单内的也要打印出来，不许悄悄吞掉。
          CLEAN=/tmp/plugin-tests-clean.log
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/plugin-tests.log > "$CLEAN"
          SKIPPED=$(grep -E '^ℹ skipped ' "$CLEAN" | awk '{print $3}' | tail -1)
          SKIPPED=${SKIPPED:-0}
          if [ "$SKIPPED" -gt 0 ]; then
            UNDECLARED=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                # ① 真实语料回归：语料原件按设计不入库（R7），没设置 RECRUITMENT_CORPUS_ROOT 就 skip
                *'ACCEPTED skip, not a pass'*) echo "::notice title=Accepted skip::$line" ;;
                # ② 本机/CI 缺 Python 工具链（PyMuPDF + python-docx + Pillow）
                *'python with PyMuPDF'*) echo "::notice title=Accepted skip::$line" ;;
                *'reader config is invalid'*) echo "::notice title=Accepted skip::$line" ;;
                *) echo "::error title=Undeclared skip::不在声明清单里的 skip：$line"; UNDECLARED=$((UNDECLARED + 1)) ;;
              esac
            done < <(grep '^﹣' "$CLEAN" || true)
            if [ "$UNDECLARED" -gt 0 ]; then
              echo "::error title=Undeclared skip::有 $UNDECLARED 条 skip 不在声明清单里；skip 不等于通过（R3/E2）"
              exit 1
            fi
            echo "accepted skips: $SKIPPED（全部在声明清单内，逐条见上面的 notice）"
          fi

          exit "$STATUS"

  # 数据库：迁移链 + 每个迁移的自检 + 幂等。这一层是"业务真相归领域"的唯一执行点，
  # 之前完全没有 CI 覆盖（全靠本机 psql 手跑）。
  db:
    name: db (migrations + verify + idempotency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ra_ci
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations 0001..0006
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do f=$(basename "$f" .sql);
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "db/migrations/$f.sql"
          done

      - name: Verify every migration
        # 目录驱动：新增 verify-00XX.sql 自动纳入，不用改 CI（旧的硬编码列表漏掉了 0011/0012，
        # 结果是"CI 绿但新迁移从没被 verify 过"）。
        run: |
          set -euo pipefail
          for f in $(ls db/verify-*.sql | sort); do
            echo "== $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "== verify.sql"
          psql -v ON_ERROR_STOP=1 -q -f db/verify.sql

      - name: Migration lifecycle (fresh / upgrade / re-run)
        # Issue #1 §4：不能靠"重跑旧迁移"来证明幂等 —— 0008 已经改变了 0007 的目标索引形态，
        # 在 0008 之后再跑 0007 必然报 DECISION_CURRENT_INDEX_UNEXPECTED（这是 0007 的守卫在正常工作）。
        # 真实迁移器语义是"每个版本只应用一次"，所以这里验证三组：
        #   fresh   ：空库一次跑完 0001→0009
        #   upgrade ：0001→0007 之后再跑 0008、0009（模拟老库升级）
        #   re-run  ：在已迁移库上重跑**最新一条** 0009（它必须幂等）
        run: |
          set -euo pipefail
          # 目录驱动：新增迁移自动纳入 fresh / upgrade / re-run 三组。旧的硬编码列表让
          # 0012 提交后 ra_upgrade 台账止于 0010、re-run 也没测它 —— CI 绿但新迁移没被覆盖。
          mapfile -t ALL < <(ls db/migrations/*.sql | sort)
          MIGS=$(printf '%s\n' "${ALL[@]}" | xargs -n1 basename | sed 's/\.sql$//')

          echo "== fresh: 0001→latest on a brand-new database"
          psql -v ON_ERROR_STOP=1 -q -c "create database ra_fresh"
          for f in "${ALL[@]}"; do psql -v ON_ERROR_STOP=1 -q -d ra_fresh -f "$f"; done

          echo "== upgrade: 0001→0007, then 0008 alone, then the rest"
          psql -v ON_ERROR_STOP=1 -q -c "create database ra_upgrade"
          for f in "${ALL[@]}"; do
            case "$(basename "$f")" in
              000[1-7]_*) psql -v ON_ERROR_STOP=1 -q -d ra_upgrade -f "$f" ;;
            esac
          done
          for f in "${ALL[@]}"; do
            case "$(basename "$f")" in
              0008_*) psql -v ON_ERROR_STOP=1 -q -d ra_upgrade -f "$f" ;;
            esac
          done
          for f in "${ALL[@]}"; do
            case "$(basename "$f")" in
              000[1-8]_*) : ;;
              *) psql -v ON_ERROR_STOP=1 -q -d ra_upgrade -f "$f" ;;
            esac
          done

          echo "== re-run: latest migration twice on the migrated database"
          LATEST=$(printf '%s\n' "${ALL[@]}" | tail -1)
          echo "   latest = $LATEST"
          psql -v ON_ERROR_STOP=1 -q -d ra_fresh -f "$LATEST"

          echo "== ledger vs files: 台账必须与 db/migrations/*.sql 完全一致（漏跑 / 幽灵迁移都红）"
          # 旧写法 `diff -u ... && echo ok` 没有 exit 1：diff 报了 11 行差异，step 仍 exit 0
          # 并打印 "migration lifecycle OK"。守卫必须能失败，否则它不是守卫。
          printf '%s\n' $MIGS > /tmp/files.txt
          psql -t -A -d ra_fresh -c "select version from recruitment.schema_migration order by version" > /tmp/ledger.txt
          if ! diff -u /tmp/files.txt /tmp/ledger.txt; then
            echo "::error::ledger 与 db/migrations/*.sql 不一致（上面是 diff）：漏跑的迁移或幽灵迁移"
            exit 1
          fi
          echo "ledger matches files"
          echo "migration lifecycle OK"
  # 转换层的两个"兜底"车道。fallback 不需要库（只渲染 + 校验 + 合并语义），
  # review 需要库（队列状态机在 0003 的触发器里）。
  python-lanes:
    name: converter lanes (model fallback + human review)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ra_review_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ra_review_check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r converter/requirements.txt "psycopg[binary]>=3.2"

      - name: Apply 0001..0003 for the review lane
        run: |
          set -euo pipefail
          for f in 0001_init 0002_seed 0003_review_queue; do
            psql -v ON_ERROR_STOP=1 -q -f "db/migrations/$f.sql"
          done

      - name: model fallback tests (no database)
        working-directory: converter
        run: python -m pytest fallback/tests -q

      - name: human review tests (needs the database)
        working-directory: converter
        run: python -m pytest review/tests -q

